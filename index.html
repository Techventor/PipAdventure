<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pip 的冒险</title>
<style>
  :root{
    --ink:#0e1020;
    --panel:rgba(12,14,30,.86);
    --line:rgba(255,255,255,.14);
    --gold:#ffd257;
    --teal:#4fe3c1;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:
      radial-gradient(1200px 700px at 50% -10%, #2a2350 0%, transparent 60%),
      #0b0c18;
    color:#fff;
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  #stage{
    position:relative;
    width:min(100vw, 177.78vh);
    aspect-ratio:16/9;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08);
    background:#000;
  }
  canvas{display:block;width:100%;height:100%}

  /* ---------- HUD ---------- */
  #hud{
    position:absolute; inset:0; pointer-events:none;
    padding:clamp(8px,1.4vw,18px);
    display:flex; justify-content:space-between; align-items:flex-start;
    font-variant-numeric:tabular-nums;
    text-shadow:0 2px 0 rgba(0,0,0,.45), 0 0 12px rgba(0,0,0,.5);
  }
  .hudGroup{display:flex;gap:clamp(10px,1.6vw,22px);align-items:center}
  .stat{display:flex;gap:6px;align-items:baseline;font-size:clamp(11px,1.15vw,16px);letter-spacing:.4px}
  .stat b{font-size:clamp(14px,1.6vw,22px);font-weight:800;}
  .lbl{opacity:.72;font-size:.86em;font-weight:600}
  .coinDot{
    width:.95em;height:.95em;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fff6c9, var(--gold) 55%, #d99a12);
    box-shadow:0 0 8px rgba(255,210,87,.6);
    display:inline-block;transform:translateY(.1em);
  }
  #lives{display:flex;gap:5px;align-items:center}
  .pip{width:.72em;height:.72em;border-radius:50% 50% 46% 46%;background:#fff3e2;box-shadow:inset -2px -2px 0 rgba(0,0,0,.16);border:1.5px solid rgba(0,0,0,.35)}
  #pauseHint{position:absolute;left:50%;bottom:clamp(6px,1vw,14px);transform:translateX(-50%);font-size:clamp(10px,.95vw,13px);opacity:.5}

  /* ---------- Overlay ---------- */
  #overlay{
    position:absolute;inset:0;display:none;place-items:center;
    background:radial-gradient(700px 420px at 50% 45%, rgba(20,16,44,.55), rgba(6,6,14,.9));
    backdrop-filter:blur(3px);
  }
  #overlay.show{display:grid}
  .card{
    text-align:center;padding:clamp(20px,3vw,42px) clamp(26px,4vw,60px);
    border-radius:20px;background:var(--panel);
    border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.07);
    max-width:min(88%,620px);
  }
  .card h1{
    margin:0 0 .25em;font-size:clamp(26px,4.2vw,52px);letter-spacing:.02em;
    background:linear-gradient(180deg,#fff,#ffd257 70%,#ff9f43);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 rgba(0,0,0,.35));
  }
  .card h2{margin:0 0 .4em;font-size:clamp(20px,3vw,36px);color:var(--teal)}
  .card p{margin:.45em 0;font-size:clamp(12px,1.35vw,17px);line-height:1.7;opacity:.9}
  .keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:1.1em 0 .2em}
  kbd{
    background:#20233f;border:1px solid rgba(255,255,255,.2);border-bottom-width:3px;
    border-radius:7px;padding:.32em .62em;font:inherit;font-size:.9em;font-weight:700;min-width:2em;
  }
  .dim{opacity:.62;font-size:.92em}
  .blink{animation:bl 1.25s steps(1,end) infinite}
  @keyframes bl{50%{opacity:.25}}
  .scoreline{font-size:clamp(15px,2vw,24px);margin:.6em 0}
  .scoreline b{color:var(--gold);font-size:1.3em}

  /* ---------- Touch ---------- */
  #touch{position:absolute;inset:0;display:none;pointer-events:none}
  body.touch #touch{display:block}
  .tbtn{
    position:absolute;bottom:max(14px, env(safe-area-inset-bottom));
    width:clamp(58px,11vw,88px);aspect-ratio:1;border-radius:50%;
    background:rgba(255,255,255,.13);border:1.5px solid rgba(255,255,255,.28);
    backdrop-filter:blur(6px);
    display:grid;place-items:center;font-size:clamp(20px,4vw,32px);font-weight:800;
    pointer-events:auto;user-select:none;color:#fff;
  }
  .tbtn:active{background:rgba(255,255,255,.3)}
  #tL{left:max(14px, env(safe-area-inset-left))}
  #tR{left:calc(max(14px, env(safe-area-inset-left)) + clamp(70px,13vw,104px))}
  #tJ{right:max(14px, env(safe-area-inset-right));font-size:clamp(15px,3vw,22px)}
</style>
</head>
<body>

<div id="stage">
  <canvas id="cv" width="1024" height="576"></canvas>

  <div id="hud">
    <div class="hudGroup">
      <div class="stat"><span class="lbl">分数</span><b id="hScore">0</b></div>
      <div class="stat"><span class="coinDot"></span><b id="hCoins">0</b></div>
      <div class="stat" id="lives"></div>
    </div>
    <div class="hudGroup">
      <div class="stat"><span class="lbl">关卡</span><b id="hLevel">1-1</b></div>
      <div class="stat"><span class="lbl">时间</span><b id="hTime">0.0</b></div>
      <div class="stat"><b id="hBest" style="opacity:.7;font-size:.95em"></b></div>
    </div>
  </div>

  <div id="pauseHint">P 暂停 · R 重来 · M 静音</div>

  <div id="overlay" class="show"><div class="card" id="card"></div></div>

  <div id="touch">
    <div class="tbtn" id="tL">◀</div>
    <div class="tbtn" id="tR">▶</div>
    <div class="tbtn" id="tJ">跳</div>
  </div>
</div>

<script>
"use strict";
/* =====================================================================
   Pip 的冒险  —  单文件横版跳跃游戏
   角色 / 关卡 / 音效全部程序生成，无任何外部资源，可离线运行。
   ===================================================================== */

/* ------------------------------ 常量 ------------------------------ */
const TILE = 32, ROWS = 18, VW = 1024, VH = 576;

const EMPTY=0, GROUND=1, BRICK=2, QUESTION=3, USED=4, PLATFORM=5, SPIKE=6, PIPE=7, PIPETOP=8;
// PLATFORM 是单向平台：只从上方踩得住，从下面可以穿过去
const SOLID = new Set([GROUND,BRICK,QUESTION,USED,PIPE,PIPETOP]);

// 物理（单位：像素 / 秒）
const GRAV=1900, MAXFALL=1000;
const JUMP=800, JUMP_CUT=260;          // 跳跃初速 / 松手后的减速上限
// 起跳高度 = JUMP²/(2·GRAV) ≈ 168px = 5.3 格，滞空 ≈ 0.84s
const ACC_GND=3000, ACC_AIR=2000;      // 地面 / 空中加速度
const FRIC_GND=2600, FRIC_AIR=520;
const MAXRUN=278, COYOTE=.10, JBUF=.13;

const SMALL={w:22,h:28}, BIG={w:26,h:42};   // 小 Pip / 吃了蘑菇的大 Pip

const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
function hash(x,y){ let h=x*374761393+y*668265263; h=(h^(h>>13))*1274126177; return ((h^(h>>16))>>>0)/4294967296; }

/* ------------------------------ 主题配色 ------------------------------ */
const THEMES = {
  meadow:{
    name:"阳光草原",
    sky:[["#5fb6ee",0],["#a7dcff",.55],["#e8f7ff",1]],
    sun:"#fff6cf", sunGlow:"rgba(255,246,207,.55)",
    far:"#7fb5d8", mid:"#5fa277", near:"#3f8a5c",
    dirt:"#b07a45", dirtDark:"#8d5f34", grass:"#57c24a", grassDark:"#3a9a34",
    brick:"#c8663f", brickLine:"#8f4527",
    plank:"#b9854e", plankDark:"#8a5f34",
    rock:"#8d94a8", star:false, cloudN:9, crystal:false
  },
  mesa:{
    name:"落日台地",
    sky:[["#ff9f5a",0],["#e06a86",.5],["#5d3f80",1]],
    sun:"#ffe9a8", sunGlow:"rgba(255,190,120,.5)",
    far:"#a05a7a", mid:"#8a5f6e", near:"#6b4a5e",
    dirt:"#c08a52", dirtDark:"#95643a", grass:"#e5b25f", grassDark:"#c08a3c",
    brick:"#b5573f", brickLine:"#7d3826",
    plank:"#a9743f", plankDark:"#7d5228",
    rock:"#9a8ea0", star:false, cloudN:6, crystal:false
  },
  cavern:{
    name:"月光洞窟",
    sky:[["#150e2e",0],["#2b1c50",.55],["#4a2f6b",1]],
    sun:"#dfe6ff", sunGlow:"rgba(190,200,255,.35)",
    far:"#2a2050", mid:"#241a44", near:"#1b1334",
    dirt:"#4b3a6d", dirtDark:"#382a54", grass:"#6fe3c6", grassDark:"#3fae98",
    brick:"#5a4780", brickLine:"#3b2d58",
    plank:"#6a5590", plankDark:"#4a3a68",
    rock:"#7b74a0", star:true, cloudN:0, crystal:true
  }
};

/* ------------------------------ 音效 ------------------------------ */
const Audio_ = {
  ctx:null, master:null, muted:false, ready:false,
  init(){
    if(this.ready) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    this.ctx = new AC();
    this.master = this.ctx.createGain();
    this.master.gain.value = .5;
    this.master.connect(this.ctx.destination);
    this.ready = true;
  },
  resume(){ if(this.ready && this.ctx.state === "suspended") this.ctx.resume(); },
  tone(freq, dur, {type="square", vol=.22, slide=null, delay=0, attack=.006}={}){
    if(!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, t0);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,slide), t0+dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    o.connect(g); g.connect(this.master);
    o.start(t0); o.stop(t0+dur+.03);
  },
  noise(dur, {vol=.2, delay=0, hp=600}={}){
    if(!this.ready || this.muted) return;
    const t0 = this.ctx.currentTime + delay;
    const n = Math.floor(this.ctx.sampleRate*dur);
    const buf = this.ctx.createBuffer(1,n,this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=hp;
    const g = this.ctx.createGain(); g.gain.value = vol;
    src.connect(f); f.connect(g); g.connect(this.master);
    src.start(t0);
  },
  jump(){ this.tone(320,.16,{type:"square",vol:.16,slide:760}); },
  coin(){ this.tone(988,.07,{type:"square",vol:.14}); this.tone(1319,.14,{type:"square",vol:.13,delay:.07}); },
  stomp(){ this.noise(.12,{vol:.3,hp:400}); this.tone(180,.13,{type:"square",vol:.15,slide:70}); },
  bump(){ this.tone(150,.08,{type:"square",vol:.14,slide:95}); },
  brk(){ this.noise(.2,{vol:.3,hp:900}); this.tone(420,.12,{type:"square",vol:.1,slide:120}); },
  power(){ [523,659,784,1047,1319].forEach((f,i)=>this.tone(f,.16,{type:"triangle",vol:.17,delay:i*.06})); },
  hurt(){ this.tone(392,.5,{type:"sawtooth",vol:.2,slide:70}); this.noise(.3,{vol:.15,hp:200}); },
  die(){ [523,494,440,392,330,262].forEach((f,i)=>this.tone(f,.2,{type:"square",vol:.18,delay:i*.11})); },
  clear(){ [659,784,988,1319,988,1319,1568].forEach((f,i)=>this.tone(f,.19,{type:"triangle",vol:.19,delay:i*.115})); },
  win(){ [523,659,784,1047,1319,1047,1319,1568,2093].forEach((f,i)=>this.tone(f,.24,{type:"triangle",vol:.19,delay:i*.15})); },
  /* --- 背景音乐：五声音阶琶音 + 低音，轻量循环 --- */
  mus:{ on:false, step:0, next:0, timer:null },
  musicStart(){
    if(!this.ready || this.mus.on) return;
    this.mus.on = true; this.mus.step = 0;
    this.mus.next = this.ctx.currentTime + .12;
    this.musicTick();
  },
  musicStop(){ this.mus.on=false; if(this.mus.timer) clearTimeout(this.mus.timer); this.mus.timer=null; },
  musicTick(){
    if(!this.mus.on) return;
    const spb = .18;                       // 每步时长
    while(this.mus.next < this.ctx.currentTime + .35){
      this.musicStep(this.mus.next, this.mus.step);
      this.mus.next += spb;
      this.mus.step = (this.mus.step + 1) % 32;
    }
    this.mus.timer = setTimeout(()=>this.musicTick(), 110);
  },
  musicStep(t, s){
    if(this.muted) return;
    const PAT=[0,3,5,7,5,3,0,7, 2,5,7,10,7,5,2,9, 0,3,5,7,5,3,0,7, 4,7,9,12,9,7,4,11];
    const BAS=[0,0,0,0, 2,2,2,2, 0,0,0,0, 4,4,4,4];
    const semi = n => 261.63 * Math.pow(2, n/12);
    const ctx=this.ctx, t0=t;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="triangle";
    o.frequency.value = semi(PAT[s] + 12);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(.045, t0+.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0+.26);
    o.connect(g); g.connect(this.master); o.start(t0); o.stop(t0+.3);
    if(s % 4 === 0 && s < 16){
      const b=ctx.createOscillator(), bg=ctx.createGain();
      b.type="sine"; b.frequency.value = semi(BAS[s]-24);
      bg.gain.setValueAtTime(0.0001,t0);
      bg.gain.exponentialRampToValueAtTime(.085, t0+.02);
      bg.gain.exponentialRampToValueAtTime(0.0001, t0+.5);
      b.connect(bg); bg.connect(this.master); b.start(t0); b.stop(t0+.55);
    }
  }
};

/* ------------------------------ 输入 ------------------------------ */
const K = { left:false, right:false, jump:false, jumpBuffer:0, anyPressed:false };
(function bindInput(){
  const map = e => {
    const k = e.key;
    if(k==="ArrowLeft"||k==="a"||k==="A") return "left";
    if(k==="ArrowRight"||k==="d"||k==="D") return "right";
    if(k===" "||k==="ArrowUp"||k==="w"||k==="W"||k==="z"||k==="Z") return "jump";
    return null;
  };
  addEventListener("keydown", e=>{
    const a = map(e);
    if(a){ e.preventDefault(); if(a==="jump" && !K.jump) K.jumpBuffer = JBUF; K[a]=true; }
    K.anyPressed = true;
    if(e.key==="p"||e.key==="P"||e.key==="Escape") Game.togglePause();
    if(e.key==="r"||e.key==="R") Game.restartLevel();
    if(e.key==="m"||e.key==="M") Game.toggleMute();
  }, {passive:false});
  addEventListener("keyup", e=>{ const a=map(e); if(a){ e.preventDefault(); K[a]=false; } }, {passive:false});
  addEventListener("blur", ()=>{ K.left=K.right=K.jump=false; });

  const touch = ("ontouchstart" in window) || navigator.maxTouchPoints>0;
  if(touch) document.body.classList.add("touch");
  const hold=(id,prop)=>{
    const el=document.getElementById(id);
    const on = e=>{ e.preventDefault(); K.anyPressed=true; if(prop==="jump"&&!K.jump) K.jumpBuffer=JBUF; K[prop]=true; };
    const off= e=>{ e.preventDefault(); K[prop]=false; };
    el.addEventListener("touchstart",on,{passive:false});
    el.addEventListener("touchend",off,{passive:false});
    el.addEventListener("touchcancel",off,{passive:false});
    el.addEventListener("mousedown",on); addEventListener("mouseup",off);
  };
  hold("tL","left"); hold("tR","right"); hold("tJ","jump");
})();

/* ------------------------------ 关卡构建 ------------------------------ */
class Level {
  constructor(w, themeKey){
    this.w = w; this.h = ROWS; this.theme = THEMES[themeKey]; this.themeKey = themeKey;
    this.g = Array.from({length:ROWS}, ()=> new Uint8Array(w));
    this.ents = [];      // 敌人/金币等实体生成点
    this.plats = [];     // 移动平台
    this.spawn = {x: 3*TILE, y: (ROWS-3)*TILE};
    this.goal = {x:(w-6)*TILE, y:(ROWS-3)*TILE};
    this.bumps = new Map();
    this.qKind = new Map();      // 指定某个问号砖里装什么
    this.flagDrop = 0;           // 旗子下降进度 0~1
  }
  set(x,y,t){ if(x>=0&&x<this.w&&y>=0&&y<this.h) this.g[y][x]=t; }
  get(x,y){ if(x<0||x>=this.w||y<0||y>=this.h) return EMPTY; return this.g[y][x]; }
  q(x,y,kind){ this.set(x,y,QUESTION); if(kind) this.qKind.set(x+","+y, kind); }
  rect(x0,y0,x1,y1,t){ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) this.set(x,y,t); }
  ground(x0,x1){ this.rect(x0, ROWS-2, x1, ROWS-1, GROUND); }
  plat(x0,x1,row,t=PLATFORM){ this.rect(x0,row,x1,row,t); }
  pipe(x, height){                       // 底边贴地
    const top = ROWS-2-height;
    for(let y=top;y<=ROWS-3;y++) this.set(x,y, y===top?PIPETOP:PIPE);
    this.set(x+1,top,PIPETOP);
    for(let y=top;y<=ROWS-3;y++) this.set(x+1,y, y===top?PIPETOP:PIPE);
  }
  stairs(x0, n, dir=1){                  // 台阶
    for(let i=0;i<n;i++){
      const c = x0 + i*dir;
      this.rect(c, ROWS-2-(i+1), c, ROWS-3, GROUND);
    }
  }
  spikes(x0,x1){ this.rect(x0, ROWS-3, x1, ROWS-3, SPIKE); }   // 铺在地面之上那一行
  coins(x0,x1,row){ for(let x=x0;x<=x1;x++) this.ents.push({type:"coin", x:x*TILE+16, y:row*TILE+16}); }
  coinArc(x, row, n){ for(let i=0;i<n;i++) this.ents.push({type:"coin", x:(x+i)*TILE+16, y:(row-Math.round(Math.sin(i/(n-1)*Math.PI)*1.6))*TILE+16}); }
  enemy(type, x, row){
    // 行走敌人让脚正好落在第 row 行的底边，避免出生时嵌进地面
    if(type==="walker") this.ents.push({type, x:x*TILE+3, y:row*TILE+6});
    else this.ents.push({type, x:x*TILE+16, y:row*TILE+16});
  }
  mover(x, y, wTiles, toX, toY, speed){
    this.plats.push({x:x*TILE, y:y*TILE, w:wTiles*TILE, h:14,
      ax:x*TILE, ay:y*TILE, bx:toX*TILE, by:toY*TILE, speed, t:0, dir:1, dx:0, dy:0});
  }
}

/* 设计规则（按当前物理算出，改动跳跃参数后要重算）
   地面顶面 = 第 16 行 (y=512)。起跳可抬高 168px，滞空 0.84s。
   · 平地起跳能上的高度：第 13 行(抬 96px) 轻松，第 12 行(抬 128px) 可以
   · 坑宽 ≤ 5 格 (160px)，落地更远不现实
   · 平地上金币放在第 10~12 行；平台上的金币按平台顶面往上 5 格内
   · 移动平台最低点要在第 15 行附近，否则从地面跳不上去
   · 尖刺铺在地面之上那一行（第 15 行） */
function buildLevels(){
  const L1 = new Level(190, "meadow");
  // 地面段：0-26 / 30-58 / 62-77 / 81-96 / 100-132 / 136-189（坑都是 3 格）
  L1.ground(0,26); L1.ground(30,58); L1.ground(62,77);
  L1.ground(81,96); L1.ground(100,132); L1.ground(136,189);

  L1.coins(9,12,12);
  L1.enemy("flyer",6,7);                          // 高空飞怪：站着和地面起跳都碰不到，从高台跳上去才能踩到
  L1.q(14,12,"mush");                             // 第一个问号砖必定是变大蘑菇
  L1.set(18,12,BRICK); L1.q(19,12,"coin"); L1.set(20,12,BRICK);
  L1.coins(22,25,12);
  L1.enemy("walker",36,15);
  L1.pipe(44,2); L1.pipe(52,3);
  L1.enemy("flyer",48,7);
  L1.enemy("walker",56,15);
  L1.enemy("walker",66,15);
  L1.plat(68,72,13); L1.coins(68,72,11);
  L1.plat(84,88,12); L1.coins(84,88,10);
  L1.enemy("walker",90,15);
  L1.set(104,12,BRICK); L1.q(105,12,"star"); L1.set(106,12,BRICK);
  L1.enemy("walker",116,15);

/* ------------------------------ 粒子 ------------------------------ */
const parts = [];
function puff(x,y,n,color,spread=110,life=.6,size=3){
  for(let i=0;i<n;i++) parts.push({
    x, y, vx:rnd(-spread,spread), vy:rnd(-spread,spread*0.25),
    life:rnd(life*.6,life), max:life, color, size:rnd(size*.6,size*1.5), g:420
  });
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    p.life-=dt; if(p.life<=0){ parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
}

/* ------------------------------ 浮动分数文字 ------------------------------ */
const floaters=[];
function floatText(x,y,text,color="#fff"){ floaters.push({x,y,text,color,life:.95}); }

/* ------------------------------ 游戏 ------------------------------ */
const Game = {
  cv:null, ctx:null,
  levels:null, li:0, L:null,
  player:null, coins:0, score:0, lives:3, best:0,
  cam:0, time:0, state:"title", stateT:0, shake:0,
  paused:false, muted:false, t:0,

  init(){
    this.cv = document.getElementById("cv");
    this.ctx = this.cv.getContext("2d");
    this.levels = buildLevels();
    try{ this.best = parseInt(localStorage.getItem("pip_best")||"0",10)||0; }catch(e){ this.best=0; }
    this.loadLevel(0, true);
    this.bindOverlay();
    requestAnimationFrame(ts=>this.loop(ts));
  },

  /* --- 关卡装载 --- */
  loadLevel(i, silent){
    this.li = i; this.L = this.levels[i];
    this.L.bumps.clear();
    this.L.flagDrop = 0;
    this.player = {
      x:this.L.spawn.x, y:this.L.spawn.y, w:SMALL.w, h:SMALL.h,
      vx:0, vy:0, onGround:false, coyote:0, facing:1,
      anim:0, invuln:0, star:0, dead:false, deadT:0,
      squash:0, blink:0, blinkT:rnd(1.5,4), ride:null,
      big:false, growWant:0, poleX:0, stompGrace:0
    };
    this.ents = this.L.ents.map(e=>({
      type:e.type, x:e.x, y:e.y, w: e.type==="coin"?18:26, h: e.type==="coin"?18:26,
      ox:e.x, oy:e.y, vx: e.type==="walker"?-58:0, vy:0, alive:true,
      t:rnd(0,6.28), squashT:0, anim:0, turnT:0
    }));
    this.plats = this.L.plats.map(p=>({...p, dx:0, dy:0}));
    this.pops = [];
    this.cam = 0; this.time = 0; this.shake = 0;
    parts.length = 0; floaters.length = 0;
    this.goalT = 0;
    if(!silent){ this.state="play"; }
  },

  restartLevel(){ if(this.state==="play"||this.state==="dead"||this.state==="paused"){ this.loadLevel(this.li); Audio_.musicStart(); } },

  bindOverlay(){
    const O = document.getElementById("overlay");
    O.addEventListener("pointerdown", ()=>{
      Audio_.init(); Audio_.resume(); K.anyPressed = true;
      if(this.state==="title"){ this.lives=3; this.score=0; this.coins=0; this.loadLevel(0); this.state="play"; Audio_.musicStart(); this.hideOverlay(); }
      else if(this.state==="win"||this.state==="gameover"){ this.state="title"; this.showTitle(); }
    });
  },

  togglePause(){
    if(this.state!=="play") return;
    this.paused = !this.paused;
    if(this.paused){ Audio_.musicStop(); this.showCard(`<h2>已暂停</h2><p class="dim">按 P 继续 · R 重来 · M 静音</p>`); }
    else { Audio_.musicStart(); this.hideOverlay(); }
  },
  toggleMute(){
    this.muted = !this.muted;
    Audio_.init();
    Audio_.muted = this.muted;
    if(Audio_.master) Audio_.master.gain.value = this.muted ? 0 : .5;
    floatText(this.player.x, this.player.y-34, this.muted?"静音":"开启声音", "#9fe8ff");
  },

  showCard(html){ const c=document.getElementById("card"); c.innerHTML=html; document.getElementById("overlay").classList.add("show"); },
  hideOverlay(){ document.getElementById("overlay").classList.remove("show"); },
  showTitle(){
    Audio_.musicStop();
    this.showCard(`
      <h1>Pip 的冒险</h1>
      <p>一个小圆探险家的三段旅程。收集金币，踩扁坏蛋，抵达终点旗。</p>
      <div class="keys">
        <span><kbd>←</kbd><kbd>→</kbd> 移动</span>
        <span><kbd>空格</kbd> 跳跃</span>
        <span><kbd>R</kbd> 重来</span>
        <span><kbd>M</kbd> 静音</span>
      </div>
      <p class="blink" style="margin-top:1.2em">按任意键开始</p>
      <p class="dim" style="margin-top:.6em">最高分 <b style="color:var(--gold)">${this.best}</b></p>
    `);
  },

  /* ------------------------------ 主循环 ------------------------------ */
  loop(ts){
    const dt = Math.min(.05, (ts - this.t)/1000 || 0);
    this.t = ts;
    if(!this.paused) this.update(dt);
    this.render();
    requestAnimationFrame(t2=>this.loop(t2));
  },

  /* ------------------------------ 更新 ------------------------------ */
  update(dt){
    this.stateT += dt;
    if(this.state==="title"){ K.anyPressed=false; this.updateAttract(dt); return; }

    updateParts(dt);
    for(let i=floaters.length-1;i>=0;i--){ const f=floaters[i]; f.life-=dt; f.y-=34*dt; if(f.life<=0) floaters.splice(i,1); }
    if(this.shake>0) this.shake = Math.max(0, this.shake - dt*3.2);
    // 方块顶起动画
    for(const [k,v] of this.L.bumps){ v.t -= dt; if(v.t<=0) this.L.bumps.delete(k); }

    if(this.state==="levelclear"){
      this.goalT += dt;
      const p = this.player, gy = this.L.goal.y;
      const poleBottom = gy + 26;
      const k = clamp((this.goalT - .10) / 1.05, 0, 1);
      const e = k*k*(3-2*k);                       // 平滑下滑
      this.L.flagDrop = e;
      p.x = p.poleX;
      p.y = lerp(p.slideFrom, poleBottom - p.h, e);
      p.anim += dt*9;
      p.squash = lerp(p.squash, 0, 1-Math.pow(.0009,dt));
      if(k >= 1 && !p.landed){
        p.landed = true; p.squash = .34; this.shake = .3;
        puff(p.x+p.w/2, p.y+p.h, 16, "#ffd257", 180, .9, 4);
        Audio_.coin();
      }
      if(this.goalT > 2.2) this.nextLevel();
      this.updateCam(dt);
      return;
    }
    if(this.state==="dead"){
      const p=this.player;
      p.deadT += dt;
      p.vy += GRAV*1.15*dt; p.y += p.vy*dt;
      if(p.deadT>1.5){
        this.lives--;
        if(this.lives<=0){ this.state="gameover"; this.saveBest(); this.showCard(`<h2>游戏结束</h2><p>旅程到此为止……</p><div class="scoreline">得分 <b>${this.score}</b></div><p class="blink">按任意键回到标题</p>`); }
        else { this.loadLevel(this.li); Audio_.musicStart(); }
      }
      return;
    }
    if(this.state!=="play") return;
    if(this.pendingStart){ K.jumpBuffer = 0; return; }   // 关卡切换提示期间暂停

    this.time += dt;
    this.updatePlats(dt);
    this.updateEntities(dt);
    this.updatePlayer(dt);
    this.updateCam(dt);

    if(this.player.y > VH + 120 && this.state==="play") this.kill();

    // HUD
    document.getElementById("hScore").textContent = this.score;
    document.getElementById("hCoins").textContent = this.coins;
    document.getElementById("hLevel").textContent = `1-${this.li+1}`;
    document.getElementById("hTime").textContent = this.time.toFixed(1);
    document.getElementById("hBest").textContent = this.best?("最高 "+this.best):"";
    const lv=document.getElementById("lives");
    if(lv.childElementCount!==Math.max(0,this.lives)){
      lv.innerHTML = "";
      for(let i=0;i<Math.max(0,this.lives);i++){ const d=document.createElement("div"); d.className="pip"; lv.appendChild(d); }
    }
  },

  updateAttract(dt){
    // 标题界面的装饰粒子
    this.attractT = (this.attractT||0) + dt;
    if(this.attractT > .13){ this.attractT = 0; puff(rnd(40,VW-40), VH+10, 1, "rgba(255,255,255,.5)", 30, 2.6, 2); }
    updateParts(dt);
  },

  nextLevel(){
    this.saveBest();
    if(this.li+1 >= this.levels.length){
      this.state="win"; Audio_.win();
      this.showCard(`<h2>全部通关！</h2><p>Pip 走完了三段旅程。</p><div class="scoreline">总得分 <b>${this.score}</b></div><p class="dim">最高分 ${this.best} · 总用时 ${this.time.toFixed(1)} 秒</p><p class="blink">按任意键回到标题</p>`);
      Audio_.musicStop();
    } else {
      this.loadLevel(this.li+1);
      this.state="play";
      Audio_.musicStart();
      this.showCard(`<h2>第 1-${this.li} 关完成</h2><p>进入 ${this.levels[this.li].theme.name}…</p><p class="blink">按任意键继续</p>`);
      this.pendingStart = true;
    }
  },

  saveBest(){ if(this.score>this.best){ this.best=this.score; try{ localStorage.setItem("pip_best", String(this.best)); }catch(e){} } },

  /* --- 变大 / 变小（吃了蘑菇） --- */
  canFit(x,y,w,h){
    for(let ty=Math.floor(y/TILE); ty<=Math.floor((y+h-1)/TILE); ty++)
      for(let tx=Math.floor(x/TILE); tx<=Math.floor((x+w-1)/TILE); tx++)
        if(SOLID.has(this.L.get(tx,ty))) return false;
    return true;
  },
  grow(){
    const p=this.player;
    if(p.big) return true;
    const cx = p.x + p.w/2;
    const nx = cx - BIG.w/2, ny = p.y - (BIG.h - SMALL.h);
    if(!this.canFit(nx, ny, BIG.w, BIG.h)) return false;   // 头顶有砖就先不变，过一会儿再试
    p.big=true; p.w=BIG.w; p.h=BIG.h; p.x=nx; p.y=ny;
    p.squash = -.34;
    this.score += 200;
    Audio_.power();
    floatText(p.x + p.w/2, p.y - 22, "变大！", "#7dffb0");
    puff(p.x+p.w/2, p.y+p.h, 18, "#ff8a5c", 170, .85, 4);
    return true;
  },
  shrink(){
    const p=this.player;
    if(!p.big) return;
    const cx = p.x + p.w/2;
    p.big=false; p.w=SMALL.w; p.h=SMALL.h; p.x = cx - SMALL.w/2; p.y += (BIG.h - SMALL.h);
    p.invuln = 1.8; p.squash = .3;
    floatText(p.x + p.w/2, p.y - 22, "变小了", "#ffb4b4");
  },

  updateCam(dt){
    const p=this.player;
    const target = clamp(p.x + p.w/2 - VW*0.42, 0, this.L.w*TILE - VW);
    this.cam = lerp(this.cam, target, 1-Math.pow(.0012, dt));
  },

  /* --- 移动平台 --- */
  updatePlats(dt){
    for(const pl of this.plats){
      const px=pl.x, py=pl.y;
      pl.t += dt * (pl.speed/100);
      const k = (Math.sin(pl.t)+1)/2;
      pl.x = lerp(pl.ax, pl.bx, k);
      pl.y = lerp(pl.ay, pl.by, k);
      pl.dx = pl.x - px; pl.dy = pl.y - py;
    }
  },

  /* --- 玩家 --- */
  updatePlayer(dt){
    const p = this.player;
    if(p.dead) return;
    if(p.invuln>0) p.invuln-=dt;
    if(p.stompGrace>0) p.stompGrace-=dt;
    if(p.star>0){ p.star-=dt; if(p.star<=0) floatText(p.x,p.y-40,"能力结束","#ffd257"); }
    if(p.growWant>0){ p.growWant -= dt; if(this.grow()) p.growWant = 0; }

    const maxRun = MAXRUN * (p.star>0?1.18:1);
    const dir = (K.right?1:0) - (K.left?1:0);
    const acc = p.onGround ? ACC_GND : ACC_AIR;
    const fric = p.onGround ? FRIC_GND : FRIC_AIR;

    if(dir!==0){
      p.vx += dir*acc*dt; p.facing = dir;
    } else {
      const f = fric*dt;
      if(Math.abs(p.vx)<=f) p.vx=0; else p.vx -= Math.sign(p.vx)*f;
    }
    p.vx = clamp(p.vx, -maxRun, maxRun);

    // 土狼时间 / 跳跃缓冲
    if(p.onGround) p.coyote = COYOTE; else p.coyote -= dt;
    if(K.jumpBuffer>0) K.jumpBuffer -= dt;
    if(K.jumpBuffer>0 && p.coyote>0){
      p.vy = -JUMP; p.onGround=false; p.coyote=0; K.jumpBuffer=0;
      p.squash = -0.28; Audio_.jump();
      puff(p.x, p.y+p.h, 5, "rgba(255,255,255,.55)", 70, .35, 2.4);
    }
    if(!K.jump && p.vy < -JUMP_CUT) p.vy = -JUMP_CUT;

    p.vy += GRAV*dt;
    if(p.vy > MAXFALL) p.vy = MAXFALL;

    // 继承移动平台的位移
    if(p.ride && p.ride.dx!==undefined){ p.x += p.ride.dx; p.y += p.ride.dy; }

    p.squash = lerp(p.squash, 0, 1-Math.pow(.0009,dt));
    this.moveX(p, dt);
    this.moveY(p, dt);

    // 动画
    p.anim += (Math.abs(p.vx)>16 && p.onGround) ? dt*Math.abs(p.vx)/22 : 0;
    p.blinkT -= dt;
    if(p.blinkT<=0){ p.blink=.12; p.blinkT=rnd(1.8,4.5); }
    if(p.blink>0) p.blink-=dt;

    // 与敌人/物品交互
    this.hitEntities(p);

    // 抵达终点：抓住旗杆，旗子会跟着降下来
    const gx = this.L.goal.x + 4, gy = this.L.goal.y;
    if(this.player.x + this.player.w > gx-8 && this.player.x < gx+34 && this.player.y+this.player.h > gy-120){
      this.state = "levelclear"; this.goalT = 0;
      this.player.vx = 0; this.player.vy = 0;
      this.player.ride = null;
      this.player.poleX = gx + 10 - this.player.w/2;
      this.player.x = this.player.poleX;
      this.player.slideFrom = this.player.y;
      this.player.landed = false;
      this.score += 300;
      Audio_.clear(); Audio_.musicStop();
      this.shake = .2;
    }
  },

  moveX(e, dt){
    e.x += e.vx*dt;
    // 底部收进 3px：脚踩在地面时身体会微微陷入地面那一行，不能把它当成墙
    const y0 = Math.floor((e.y+2)/TILE), y1 = Math.floor((e.y+e.h-3)/TILE);
    if(e.vx > 0){
      const tx = Math.floor((e.x+e.w-1)/TILE);
      for(let y=y0;y<=y1;y++) if(SOLID.has(this.L.get(tx,y))){ e.x = tx*TILE - e.w; e.vx=0; break; }
    } else if(e.vx < 0){
      const tx = Math.floor(e.x/TILE);
      for(let y=y0;y<=y1;y++) if(SOLID.has(this.L.get(tx,y))){ e.x = (tx+1)*TILE; e.vx=0; break; }
    }
    // 移动平台（侧面）
    for(const pl of this.plats){
      if(this.aabb(e, pl)){
        if(e.vx>0){ e.x = pl.x - e.w; } else if(e.vx<0){ e.x = pl.x + pl.w; }
        e.vx = 0;
      }
    }
  },

  moveY(e, dt){
    const wasGround = e.onGround;
    e.onGround = false;
    e.ride = null;
    const prevBottom = e.y + e.h;
    e.y += e.vy*dt;
    const x0 = Math.floor(e.x/TILE), x1 = Math.floor((e.x+e.w-1)/TILE);

    if(e.vy > 0){
      const ty = Math.floor((e.y+e.h)/TILE);
      for(let x=x0;x<=x1;x++){
        const t = this.L.get(x,ty);
        // 单向平台：只有从上方落下时才踩得住
        const solid = SOLID.has(t) || (t===PLATFORM && prevBottom <= ty*TILE + 8);
        if(!solid) continue;
        e.y = ty*TILE - e.h; e.vy = 0; e.onGround = true;
        if(!wasGround && e===this.player){ e.squash = .34; puff(e.x+e.w/2, e.y+e.h, 6, "rgba(255,255,255,.5)", 90, .35, 2.6); }
        break;
      }
      // 踩到移动平台
      for(const pl of this.plats){
        if(e.x+e.w > pl.x+2 && e.x < pl.x+pl.w-2 && prevBottom <= pl.y+6 && e.y+e.h >= pl.y){
          e.y = pl.y - e.h; e.vy = 0; e.onGround = true; e.ride = pl;
        }
      }
    } else if(e.vy < 0){
      const ty = Math.floor(e.y/TILE);
      let hitX = -1, bestD = 1e9;
      for(let x=x0;x<=x1;x++) if(SOLID.has(this.L.get(x,ty))){
        const d = Math.abs((x*TILE+16) - (e.x+e.w/2));
        if(d < bestD){ bestD = d; hitX = x; }
      }
      if(hitX>=0){
        e.y = (ty+1)*TILE; e.vy = 0;
        if(e===this.player) this.headHit(hitX, ty);
      }
    }
    // 掉出移动平台
    if(e.vy >= 0 && e.ride === null){
      for(const pl of this.plats){
        if(e.x+e.w > pl.x && e.x < pl.x+pl.w && Math.abs((e.y+e.h) - pl.y) < 8){
          e.y = pl.y - e.h; e.vy = 0; e.onGround = true; e.ride = pl;
        }
      }
    }
    // 尖刺
    if(e===this.player && this.state==="play"){
      const cy = Math.floor((e.y+e.h-6)/TILE);
      for(let x=x0;x<=x1;x++){
        if(this.L.get(x,cy)===SPIKE || this.L.get(x,cy+1)===SPIKE){ this.hurt(); break; }
      }
    }
  },

  aabb(a,b){ return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y; },

  /* --- 顶砖块 --- */
  headHit(tx,ty){
    const t = this.L.get(tx,ty);
    if(t===QUESTION){
      this.L.set(tx,ty,USED);
      this.L.bumps.set(tx+","+ty, {t:.22, pow:1});
      const h = hash(tx,ty);
      const kind = this.L.qKind.get(tx+","+ty) || (h < .45 ? "coin" : (h < .85 ? "mush" : "star"));
      this.spawnPop(tx,ty, kind);
      Audio_.bump();
    } else if(t===BRICK){
      // 只有变大以后（或无敌时）才顶得碎，小个子只能顶一下
      if(this.player.big || this.player.star>0){
        this.L.set(tx,ty,EMPTY);
        puff(tx*TILE+16, ty*TILE+16, 12, this.L.theme.brick, 190, .7, 4.5);
        this.score += 20; this.shake = Math.max(this.shake,.35);
        Audio_.brk();
      } else {
        this.L.bumps.set(tx+","+ty, {t:.18, pow:.7});
        puff(tx*TILE+16, ty*TILE+30, 5, this.L.theme.brickLine, 90, .4, 3);
        Audio_.bump();
      }
    } else {
      this.L.bumps.set(tx+","+ty, {t:.16, pow:.45});
      Audio_.bump();
    }
  },

  spawnPop(tx,ty,kind){
    this.pops.push({ x:tx*TILE+16, y:ty*TILE, vy:-320, kind, t:0 });
  },

  updatePops(dt){
    if(!this.pops) return;
    for(let i=this.pops.length-1;i>=0;i--){
      const p=this.pops[i]; p.t+=dt;
      if(p.t<.30){ p.y += p.vy*dt; p.vy += 1400*dt; }
      else if(p.kind==="coin"){
        this.coins++; this.score+=100; Audio_.coin();
        floatText(p.x-8,p.y-26,"+100","#ffd257");
        puff(p.x,p.y,6,"#ffd257",90,.5,3);
        this.pops.splice(i,1);
      } else {
        // 蘑菇 / 星星：冒出来以后自己会走
        this.ents.push({
          type: p.kind, x:p.x-12, y:p.y, w:26, h:26, ox:p.x-12, oy:p.y,
          vx: p.kind==="mush" ? 78 : 96, vy:0, alive:true, t:0, squashT:0, anim:0, turnT:0
        });
        this.pops.splice(i,1);
      }
    }
  },

  /* --- 实体 --- */
  updateEntities(dt){
    this.updatePops(dt);
    const p = this.player;
    for(const e of this.ents){
      if(!e.alive) continue;
      e.t += dt;

      if(e.type==="coin"){
        continue;
      }
      if(e.type==="star" || e.type==="mush"){
        e.vy += GRAV*dt; if(e.vy>MAXFALL) e.vy=MAXFALL;
        e.x += e.vx*dt; e.y += e.vy*dt;
        const y0=Math.floor((e.y+2)/TILE), y1=Math.floor((e.y+e.h-3)/TILE);
        if(e.vx>0){
          const tx=Math.floor((e.x+e.w-1)/TILE);
          for(let y=y0;y<=y1;y++) if(SOLID.has(this.L.get(tx,y))){ e.x=tx*TILE-e.w; e.vx*=-1; break; }
        } else if(e.vx<0){
          const tx=Math.floor(e.x/TILE);
          for(let y=y0;y<=y1;y++) if(SOLID.has(this.L.get(tx,y))){ e.x=(tx+1)*TILE; e.vx*=-1; break; }
        }
        if(e.vy>0){
          const ty=Math.floor((e.y+e.h)/TILE);
          for(let x=Math.floor(e.x/TILE);x<=Math.floor((e.x+e.w-1)/TILE);x++){
            const t=this.L.get(x,ty);
            if(SOLID.has(t) || t===PLATFORM){ e.y=ty*TILE-e.h; e.vy = e.type==="star" ? -340 : 0; break; }
          }
        }
        e.x = clamp(e.x, 0, this.L.w*TILE-e.w);
        if(e.y > VH+320) e.alive = false;
        continue;
      }
      if(e.type==="walker"){
        if(e.squashT>0){ e.squashT-=dt; if(e.squashT<=0) e.alive=false; continue; }
        if(e.turnT>0) e.turnT -= dt;
        // 走路动画跟着实际位移走，停下来就不会抽搐
        e.anim += Math.abs(e.vx)*dt/7;
        e.vy += GRAV*dt; if(e.vy>MAXFALL) e.vy=MAXFALL;
        e.x += e.vx*dt; e.y += e.vy*dt;
        const y0=Math.floor((e.y+2)/TILE), y1=Math.floor((e.y+e.h-3)/TILE);
        let hitWall=false;
        if(e.vx>0){ const tx=Math.floor((e.x+e.w-1)/TILE);
          for(let y=y0;y<=y1;y++) if(SOLID.has(this.L.get(tx,y))){ e.x=tx*TILE-e.w; hitWall=true; break; } }
        else if(e.vx<0){ const tx=Math.floor(e.x/TILE);
          for(let y=y0;y<=y1;y++) if(SOLID.has(this.L.get(tx,y))){ e.x=(tx+1)*TILE; hitWall=true; break; } }
        if(hitWall){ e.vx *= -1; e.turnT = .18; }
        const ty=Math.floor((e.y+e.h)/TILE);
        if(e.vy>0){
          let land=false;
          for(let x=Math.floor(e.x/TILE);x<=Math.floor((e.x+e.w-1)/TILE);x++)
            if(SOLID.has(this.L.get(x,ty)) || this.L.get(x,ty)===PLATFORM){ e.y=ty*TILE-e.h; e.vy=0; land=true; break; }
          if(land){
            // 走到悬崖边就掉头（加冷却，免得在边缘来回抖）
            const ahead = Math.floor((e.x + (e.vx>0? e.w+4 : -4))/TILE);
            const below = Math.floor((e.y+e.h+4)/TILE);
            if(!SOLID.has(this.L.get(ahead, below)) && this.L.get(ahead,below)!==PLATFORM && e.turnT<=0){
              e.vx *= -1; e.turnT = .25;
            }
          }
        }
        if(e.y > VH+200) e.alive = false;
        continue;
      }
      if(e.type==="flyer"){
        if(e.squashT>0){ e.squashT-=dt; if(e.squashT<=0) e.alive=false; continue; }
        const nx = e.ox + Math.sin(e.t*1.15)*40;
        const ny = e.oy + Math.sin(e.t*2.0)*20;
        e.dx = nx - e.x; e.dy = ny - e.y;      // 留给绘制做朝向
        e.x = nx; e.y = ny;
        e.anim += dt*13;
        continue;
      }
    }
    this.ents = this.ents.filter(e=>e.alive || e.squashT>0);
  },

  hitEntities(p){
    if(p.dead) return;
    // 进入这一帧时的下落速度。踩扁一个敌人会立刻把 p.vy 改成 -430，
    // 如果同一帧里还挨着第二个敌人，就不能再用 p.vy 判断“是不是踩”，否则会被误判成侧面撞上而白白送命。
    const vyIn = p.vy;
    for(const e of this.ents){
      if(!e.alive) continue;
      if(e.type==="coin"){
        if(this.aabb(p, {x:e.x-11,y:e.y-11,w:22,h:22})){
          e.alive=false; this.coins++; this.score+=100; Audio_.coin();
          floatText(e.x-8,e.y-22,"+100","#ffd257");
          puff(e.x,e.y,7,"#ffd257",110,.5,3);
          if(this.coins>0 && this.coins%25===0){ this.lives++; floatText(p.x,p.y-44,"1UP","#7dffb0"); Audio_.power(); }
        }
        continue;
      }
      if(e.type==="star"){
        if(this.aabb(p, e)){
          e.alive=false; p.star = 8.0; Audio_.power(); this.score+=200;
          floatText(e.x-26,e.y-26,"无敌 8 秒","#ffd257");
          puff(e.x+13,e.y+13,20,"#ffe9a8",170,.9,4);
        }
        continue;
      }
      if(e.type==="mush"){
        if(this.aabb(p, e)){
          e.alive=false;
          puff(e.x+13,e.y+13,16,"#ff8a5c",160,.8,4);
          if(p.big){ this.score+=200; floatText(e.x-8,e.y-24,"+200","#7dffb0"); Audio_.coin(); }
          else if(!this.grow()) p.growWant = 2.5;      // 头顶有砖就稍后再变
        }
        continue;
      }
      if(e.type==="walker" || e.type==="flyer"){
        if(e.squashT>0) continue;
        if(!this.aabb(p, e)) continue;
        const stomping = vyIn > 60 && (p.y + p.h) < e.y + e.h*0.7;
        if(p.star>0){
          e.squashT = .001; e.alive=false;
          this.score+=200; floatText(e.x-8,e.y-24,"+200","#ffd257");
          puff(e.x,e.y,14,"#ffd257",180,.7,4); Audio_.stomp();
        } else if(stomping){
          e.squashT = .32; e.vx = 0;
          p.vy = -430; p.squash = -.3;
          p.stompGrace = .12;            // 弹起的一瞬间别再被旁边另一个敌人蹭死
          this.score += 150; floatText(e.x-8,e.y-24,"+150","#9fe8ff");
          puff(e.x,e.y+e.h/2,10,"#ffffff",150,.5,3.5); Audio_.stomp();
          this.shake = Math.max(this.shake,.2);
        } else if(p.stompGrace > 0){
          // 刚落下来踩扁过敌人，这 0.12 秒内不再受伤
        } else {
          this.hurt();
        }
      }
    }
  },

  hurt(){
    const p=this.player;
    if(p.invuln>0 || p.star>0 || this.state!=="play") return;
    if(p.big){                       // 变大的状态下挨一下只是变小，不会死
      this.shrink();
      Audio_.hurt();
      this.shake = .45;
      puff(p.x+p.w/2, p.y+p.h/2, 12, "#ffb4b4", 150, .6, 3.5);
      return;
    }
    p.dead = true; p.vy = -430; p.vx = 0;
    this.state = "dead"; p.deadT = 0;
    Audio_.hurt(); Audio_.die(); Audio_.musicStop();
    this.shake = .6;
  },
  kill(){ this.hurt(); },

  /* ------------------------------ 渲染 ------------------------------ */
  render(){
    const c = this.ctx, T = this.L.theme;
    c.save();
    if(this.shake>0){
      const s = this.shake*9;
      c.translate(rnd(-s,s), rnd(-s,s));
    }
    this.drawSky(c,T);
    this.drawParallax(c,T);
    c.save();
    c.translate(-Math.round(this.cam), 0);
    this.drawTiles(c,T);
    this.drawPlats(c,T);
    this.drawGoal(c,T);
    this.drawParts(c);
    this.drawEnts(c);
    if(this.state!=="title") this.drawPlayer(c);
    this.drawFloaters(c);
    c.restore();
    this.drawVignette(c,T);
    c.restore();
  },

  drawSky(c,T){
    const g = c.createLinearGradient(0,0,0,VH);
    T.sky.forEach(([col,pos])=>g.addColorStop(pos,col));
    c.fillStyle = g; c.fillRect(0,0,VW,VH);

    if(T.star){
      for(let i=0;i<70;i++){
        const x = (hash(i,1)*VW*2 - this.cam*0.08) % (VW+40);
        const y = hash(i,2)*VH*0.62;
        const tw = .5 + .5*Math.sin(this.t/420 + i);
        c.globalAlpha = .35 + tw*.5;
        c.fillStyle = "#dfe6ff";
        c.fillRect((x+VW+40)%(VW+40)-20, y, 2, 2);
      }
      c.globalAlpha = 1;
    }
    // 太阳 / 月亮
    const sx = VW*0.78 - this.cam*0.02, sy = VH*0.22;
    const rg = c.createRadialGradient(sx,sy,4, sx,sy,150);
    rg.addColorStop(0, T.sunGlow); rg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = rg; c.beginPath(); c.arc(sx,sy,150,0,7); c.fill();
    c.fillStyle = T.sun; c.beginPath(); c.arc(sx,sy, T.star?34:44, 0, 7); c.fill();
    if(T.star){ c.fillStyle = "rgba(0,0,0,.001)"; }
  },

  drawParallax(c,T){
    // 云
    if(T.cloudN){
      c.fillStyle = this.li===0 ? "rgba(255,255,255,.82)" : "rgba(255,225,205,.4)";
      for(let i=0;i<T.cloudN;i++){
        const bx = i*(VW*1.6/T.cloudN) + hash(i,7)*180;
        const x = ((bx - this.cam*0.24) % (VW*1.6) + VW*1.6) % (VW*1.6) - 200;
        const y = 46 + hash(i,3)*140;
        const s = .7 + hash(i,5)*.7;
        this.cloud(c, x, y, s);
      }
    }
    // 远景山
    const layers = [[T.far,0.16,VH*0.60,150],[T.mid,0.34,VH*0.70,100],[T.near,0.56,VH*0.80,66]];
    for(const [col,par,base,h] of layers){
      c.fillStyle = col;
      c.beginPath(); c.moveTo(0,VH);
      const off = this.cam*par;
      const step = 190;
      const start = Math.floor(off/step)-1;
      for(let i=start;i<start+10;i++){
        const x = i*step - off;
        const peak = base - h*(.55 + hash(i, Math.round(par*100))*0.8);
        c.lineTo(x, base);
        c.lineTo(x+step/2, peak);
        c.lineTo(x+step, base);
      }
      c.lineTo(VW*2, VH); c.closePath(); c.fill();
    }
    if(T.crystal){
      // 洞窟水晶
      for(let i=0;i<16;i++){
        const x = ((i*260 + hash(i,11)*120) - this.cam*0.42) % (VW*2.4);
        const xx = (x+VW*2.4)%(VW*2.4)-120;
        const hh = 24 + hash(i,13)*54;
        c.globalAlpha=.5;
        c.fillStyle = i%3===0 ? "#6fe3c6" : "#8f7bff";
        c.beginPath(); c.moveTo(xx,VH*0.62); c.lineTo(xx+9,VH*0.62-hh); c.lineTo(xx+18,VH*0.62); c.closePath(); c.fill();
        c.globalAlpha=1;
      }
    }
  },
  cloud(c,x,y,s){
    c.beginPath();
    c.arc(x, y, 26*s, 0, 7);
    c.arc(x+30*s, y-10*s, 32*s, 0, 7);
    c.arc(x+66*s, y, 24*s, 0, 7);
    c.rect(x-4, y, 74*s, 22*s);
    c.fill();
  },

  drawTiles(c,T){
    const x0 = Math.max(0, Math.floor(this.cam/TILE)-1);
    const x1 = Math.min(this.L.w-1, Math.floor((this.cam+VW)/TILE)+1);
    for(let ty=0;ty<ROWS;ty++){
      for(let tx=x0;tx<=x1;tx++){
        const t = this.L.g[ty][tx];
        if(t===EMPTY) continue;
        const bump = this.L.bumps.get(tx+","+ty);
        let oy = 0;
        if(bump) oy = -Math.sin((1-bump.t/(bump.pow>0.9?.22:.16))*Math.PI)*9*bump.pow;
        this.tile(c, T, t, tx*TILE, ty*TILE + oy, tx, ty);
      }
    }
  },

  tile(c,T,t,x,y,tx,ty){
    const S=TILE;
    switch(t){
      case GROUND: {
        const topOpen = this.L.get(tx,ty-1)===EMPTY;
        c.fillStyle = T.dirt; c.fillRect(x,y,S,S);
        c.fillStyle = T.dirtDark;
        for(let i=0;i<3;i++){
          const hx = x + 4 + hash(tx*3+i, ty*5)*20;
          const hy = y + 8 + hash(tx*7, ty*3+i)*18;
          c.fillRect(hx, hy, 4, 3);
        }
        c.fillStyle = "rgba(0,0,0,.12)"; c.fillRect(x,y+S-3,S,3);
        c.fillStyle = "rgba(255,255,255,.07)"; c.fillRect(x,y,2,S);
        if(topOpen){
          c.fillStyle = T.grass; c.fillRect(x,y,S,9);
          c.fillStyle = T.grassDark; c.fillRect(x,y+7,S,3);
          c.fillStyle = T.grass;
          for(let i=0;i<3;i++){
            const gx = x + 3 + i*11 + hash(tx,i)*3;
            c.fillRect(gx, y-3, 2, 4);
          }
        }
        break;
      }
      case BRICK: {
        c.fillStyle = T.brick; c.fillRect(x,y,S,S);
        c.strokeStyle = T.brickLine; c.lineWidth=2;
        c.beginPath();
        c.moveTo(x,y+10.5); c.lineTo(x+S,y+10.5);
        c.moveTo(x,y+21.5); c.lineTo(x+S,y+21.5);
        c.moveTo(x+16,y); c.lineTo(x+16,y+10.5);
        c.moveTo(x+8,y+10.5); c.lineTo(x+8,y+21.5);
        c.moveTo(x+24,y+10.5); c.lineTo(x+24,y+21.5);
        c.moveTo(x+16,y+21.5); c.lineTo(x+16,y+S);
        c.stroke();
        c.fillStyle="rgba(255,255,255,.12)"; c.fillRect(x,y,S,2);
        break;
      }
      case QUESTION: {
        const pulse = .5+.5*Math.sin(this.t/240 + tx);
        c.fillStyle = "#e8a92c"; c.fillRect(x,y,S,S);
        c.fillStyle = `rgba(255,232,150,${.35+pulse*.35})`; c.fillRect(x+2,y+2,S-4,S-4);
        c.fillStyle = "#b8781a";
        [[3,3],[S-7,3],[3,S-7],[S-7,S-7]].forEach(([a,b])=>c.fillRect(x+a,y+b,4,4));
        c.fillStyle="#7a4d08"; c.font="bold 19px system-ui,sans-serif";
        c.textAlign="center"; c.textBaseline="middle";
        c.fillText("?", x+S/2, y+S/2+1);
        break;
      }
      case USED: {
        c.fillStyle = "#9a7b52"; c.fillRect(x,y,S,S);
        c.fillStyle = "#7d6242"; c.fillRect(x+3,y+3,S-6,S-6);
        c.fillStyle="rgba(0,0,0,.15)"; c.fillRect(x,y+S-4,S,4);
        break;
      }
      case PLATFORM: {
        c.fillStyle = T.plank; c.fillRect(x,y,S,16);
        c.fillStyle = T.plankDark; c.fillRect(x,y+14,S,4);
        c.fillStyle = "rgba(255,255,255,.16)"; c.fillRect(x,y,S,3);
        c.strokeStyle="rgba(0,0,0,.14)"; c.lineWidth=1;
        c.beginPath(); c.moveTo(x+16,y+3); c.lineTo(x+16,y+14); c.stroke();
        break;
      }
      case SPIKE: {
        c.fillStyle = "rgba(30,20,45,.5)"; c.fillRect(x,y+29,S,3);
        c.fillStyle = T.rock;
        for(let i=0;i<4;i++){
          const sx = x + i*8;
          c.beginPath(); c.moveTo(sx,y+31); c.lineTo(sx+4,y+7); c.lineTo(sx+8,y+31); c.closePath(); c.fill();
        }
        c.fillStyle="rgba(255,255,255,.4)";
        for(let i=0;i<4;i++){ c.beginPath(); c.moveTo(x+i*8+4,y+9); c.lineTo(x+i*8+5.5,y+18); c.lineTo(x+i*8+2.5,y+18); c.closePath(); c.fill(); }
        break;
      }
      case PIPE: case PIPETOP: {
        const isTop = (t===PIPETOP);
        const w = isTop ? 38 : 30, ox = isTop ? -3 : 1;
        const g = c.createLinearGradient(x+ox,0,x+ox+w,0);
        g.addColorStop(0,"#3f8f3a"); g.addColorStop(.28,"#6fd05a"); g.addColorStop(.62,"#4aa83f"); g.addColorStop(1,"#2c6b2b");
        c.fillStyle=g; c.fillRect(x+ox, y, w, S);
        c.strokeStyle="rgba(0,0,0,.28)"; c.lineWidth=2;
        c.strokeRect(x+ox+1, y-1, w-2, S+2);
        break;
      }
    }
  },

  drawPlats(c,T){
    for(const pl of this.plats){
      c.fillStyle = "#8c6bd6";
      c.fillRect(pl.x, pl.y, pl.w, pl.h);
      c.fillStyle = "rgba(255,255,255,.3)";
      c.fillRect(pl.x, pl.y, pl.w, 3);
      c.fillStyle = "rgba(255,255,255,.9)";
      for(let i=0;i<3;i++) c.fillRect(pl.x+8+i*(pl.w-16)/2, pl.y+5, 4, 4);
    }
  },

  drawGoal(c,T){
    const gx = this.L.goal.x, gy = this.L.goal.y;
    const drop = this.L.flagDrop || 0;
    c.fillStyle = "rgba(0,0,0,.18)"; c.beginPath(); c.ellipse(gx+12, gy+30, 22, 7, 0,0,7); c.fill();
    // 光晕
    const rg = c.createRadialGradient(gx+10, gy-20, 4, gx+10, gy-20, 62);
    rg.addColorStop(0, `rgba(255,210,87,${.30 + drop*.15})`); rg.addColorStop(1,"rgba(255,210,87,0)");
    c.fillStyle = rg; c.beginPath(); c.arc(gx+10, gy-20, 62, 0, 7); c.fill();
    // 旗杆（够高，跳上去抓能一路滑下来）
    c.fillStyle = "#cfd6e6"; c.fillRect(gx+6, gy-150, 8, 180);
    c.fillStyle = "rgba(255,255,255,.7)"; c.fillRect(gx+6, gy-150, 2.5, 180);
    c.fillStyle = "#9aa3bb"; c.fillRect(gx+40, gy+22, 26, 8);
    c.fillStyle = "#ffd257"; c.beginPath(); c.arc(gx+10, gy-153, 5.5, 0, 7); c.fill();
    // 旗子沿杆下滑（过关时 drop 从 0 走到 1）
    const fo = drop * 128;
    const wave = Math.sin(this.t/260)*5;
    const grd = c.createLinearGradient(gx+14, 0, gx+72, 0);
    grd.addColorStop(0,"#ff8a5c"); grd.addColorStop(1,"#ffd257");
    c.fillStyle = grd;
    c.beginPath();
    c.moveTo(gx+14, gy-146+fo);
    c.quadraticCurveTo(gx+44, gy-136+fo+wave, gx+72, gy-124+fo);
    c.quadraticCurveTo(gx+44, gy-112+fo+wave, gx+14, gy-104+fo);
    c.closePath(); c.fill();
    c.strokeStyle = "rgba(120,60,10,.35)"; c.lineWidth = 1.5; c.stroke();
    // 旗面反弹的小光点
    if(drop > 0 && drop < 1){
      c.fillStyle = "rgba(255,240,170,.9)";
      for(let i=0;i<3;i++) c.fillRect(gx+20+i*16, gy-148+fo+Math.sin(this.t/90+i)*6, 4, 4);
    }
  },

  drawParts(c){
    for(const p of parts){
      c.globalAlpha = clamp(p.life/p.max,0,1);
      c.fillStyle = p.color;
      c.fillRect(p.x-p.size/2, p.y-p.size/2, p.size, p.size);
    }
    c.globalAlpha = 1;
  },

  drawFloaters(c){
    c.textAlign="center"; c.textBaseline="middle";
    for(const f of floaters){
      c.globalAlpha = clamp(f.life/.95,0,1);
      c.font = "bold 15px system-ui,sans-serif";
      c.lineWidth = 4; c.strokeStyle="rgba(0,0,0,.5)";
      c.strokeText(f.text, f.x+10, f.y);
      c.fillStyle = f.color; c.fillText(f.text, f.x+10, f.y);
    }
    c.globalAlpha = 1;
  },

  drawEnts(c){
    for(const e of this.ents){
      if(!e.alive && e.squashT<=0) continue;
      if(e.type==="coin") this.drawCoin(c,e);
      else if(e.type==="star") this.drawStar(c,e);
      else if(e.type==="mush") this.drawMush(c,e);
      else if(e.type==="walker") this.drawWalker(c,e);
      else if(e.type==="flyer") this.drawFlyer(c,e);
    }
  },

  /* 变大蘑菇 */
  drawMush(c,e){
    const x = Math.round(e.x) + 13, y = Math.round(e.y) + 13;
    const bob = Math.sin(e.t*5)*1.2;
    c.save(); c.translate(x, y + bob);
    c.fillStyle="rgba(0,0,0,.18)";
    c.beginPath(); c.ellipse(0, 13-bob, 11, 3.5, 0,0,7); c.fill();
    // 菌柄
    c.fillStyle="#fff3e2"; c.strokeStyle="rgba(90,60,40,.35)"; c.lineWidth=1.4;
    c.beginPath(); c.moveTo(-6.5, 2); c.lineTo(-5.5, 11);
    c.quadraticCurveTo(0, 15, 5.5, 11); c.lineTo(6.5, 2); c.closePath();
    c.fill(); c.stroke();
    // 菌盖
    const g = c.createRadialGradient(-4,-8,2, 0,-5,16);
    g.addColorStop(0,"#ff8a6a"); g.addColorStop(1,"#d63b23");
    c.fillStyle = g;
    c.beginPath(); c.moveTo(-13, 2); c.quadraticCurveTo(-13,-13, 0,-13);
    c.quadraticCurveTo(13,-13, 13, 2); c.quadraticCurveTo(0, 6, -13, 2); c.closePath();
    c.fill(); c.stroke();
    // 白点
    c.fillStyle="rgba(255,255,255,.95)";
    c.beginPath(); c.arc(-6,-6,3.1,0,7); c.fill();
    c.beginPath(); c.arc(5.5,-7.5,2.6,0,7); c.fill();
    c.beginPath(); c.arc(0.5,-10.5,2.1,0,7); c.fill();
    // 眼睛（长在菌柄上）
    c.fillStyle="#2b2233";
    c.beginPath(); c.ellipse(-2.6,6.5,1.7,2.2,0,0,7); c.fill();
    c.beginPath(); c.ellipse( 2.6,6.5,1.7,2.2,0,0,7); c.fill();
    c.restore();
  },

  drawCoin(c,e){
    const sc = Math.abs(Math.cos(e.t*2.6));
    const w = 4 + sc*13;
    const bob = Math.sin(e.t*3)*3;
    const x = e.x, y = e.y + bob;
    c.fillStyle = "rgba(0,0,0,.16)";
    c.beginPath(); c.ellipse(x, e.y+20, 9, 3, 0,0,7); c.fill();
    const g = c.createLinearGradient(x-w, y-13, x+w, y+13);
    g.addColorStop(0,"#ffe9a8"); g.addColorStop(.5,"#ffc93c"); g.addColorStop(1,"#d18f10");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(x, y, w, 13, 0, 0, 7); c.fill();
    if(w>7){
      c.strokeStyle="rgba(180,120,10,.6)"; c.lineWidth=1.6;
      c.beginPath(); c.ellipse(x, y, w-3.4, 13-3.4, 0,0,7); c.stroke();
    }
  },

  drawStar(c,e){
    const rot = e.t*2.2;
    c.save(); c.translate(e.x, e.y);
    c.rotate(rot);
    const rg = c.createRadialGradient(0,0,2,0,0,30);
    rg.addColorStop(0,"rgba(255,240,160,.85)"); rg.addColorStop(1,"rgba(255,210,87,0)");
    c.fillStyle=rg; c.beginPath(); c.arc(0,0,30,0,7); c.fill();
    c.fillStyle="#ffe066"; c.strokeStyle="#e0a11a"; c.lineWidth=2;
    c.beginPath();
    for(let i=0;i<10;i++){
      const r = i%2 ? 5.5 : 13;
      const a = -Math.PI/2 + i*Math.PI/5;
      i ? c.lineTo(Math.cos(a)*r, Math.sin(a)*r) : c.moveTo(Math.cos(a)*r, Math.sin(a)*r);
    }
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  },

  drawWalker(c,e){
    const squashed = e.squashT > 0;
    const bx = Math.round(e.x) + 13, by = Math.round(e.y) + 26;   // 脚底中心
    c.fillStyle = "rgba(0,0,0,.2)";
    c.beginPath(); c.ellipse(bx, by, 13, 3.6, 0, 0, 7); c.fill();
    c.save();
    c.translate(bx, by);
    c.scale(1, squashed ? .34 : 1);
    const ph = e.anim, step = squashed ? 0 : Math.sin(ph);
    const bob = squashed ? 0 : Math.abs(Math.sin(ph)) * 1.8;
    // 脚（跟着实际位移交替，停下来就不动）
    c.fillStyle = "#3d2154";
    c.beginPath(); c.ellipse(-7 + step * 2.6, -3.2, 6, 3.6, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse( 7 - step * 2.6, -3.2, 6, 3.6, 0, 0, 7); c.fill();
    c.save();
    c.translate(0, -bob);
    // 身体
    const g = c.createRadialGradient(-5, -17, 3, 0, -13, 21);
    g.addColorStop(0, "#cba0ee"); g.addColorStop(1, "#653a91");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, -13, 13, 13, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(28,10,46,.6)"; c.lineWidth = 1.6; c.stroke();
    // 背上的刺
    c.fillStyle = "#8b5fc0";
    for(let i = -2; i <= 2; i++){
      const sx = i * 5.2, tip = (i === 0 ? -28 : (Math.abs(i) === 1 ? -26.5 : -24));
      c.beginPath(); c.moveTo(sx - 3.2, -23); c.lineTo(sx, tip); c.lineTo(sx + 3.2, -23); c.closePath(); c.fill();
    }
    if(!squashed){
      c.fillStyle = "#fff";
      c.beginPath(); c.ellipse(-5.4, -16.5, 4.3, 4.7, 0, 0, 7); c.fill();
      c.beginPath(); c.ellipse( 5.4, -16.5, 4.3, 4.7, 0, 0, 7); c.fill();
      const ex = e.vx < 0 ? -1.5 : 1.5;
      c.fillStyle = "#241533";
      c.beginPath(); c.arc(-5.4 + ex, -16, 2.3, 0, 7); c.fill();
      c.beginPath(); c.arc( 5.4 + ex, -16, 2.3, 0, 7); c.fill();
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(-6.1 + ex, -17.2, 0.9, 0, 7); c.fill();
      c.beginPath(); c.arc( 4.7 + ex, -17.2, 0.9, 0, 7); c.fill();
      c.strokeStyle = "#3a2153"; c.lineWidth = 2.2; c.lineCap = "round";
      c.beginPath(); c.moveTo(-9.5, -22.5); c.lineTo(-2.5, -19.5); c.stroke();
      c.beginPath(); c.moveTo( 9.5, -22.5); c.lineTo( 2.5, -19.5); c.stroke();
      c.strokeStyle = "rgba(40,16,60,.85)"; c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, -9, 3.6, .15*Math.PI, .85*Math.PI); c.stroke();
    }
    c.restore();
    c.restore();
  },

  drawFlyer(c,e){
    const squashed = e.squashT > 0;
    const flap = squashed ? 0 : Math.sin(e.anim);
    // e.x/e.y 是判定框左上角（26×26），画的时候要以框中心为原点，否则打不到看得见的位置
    const bx = Math.round(e.x) + 13, by = Math.round(e.y) + 13;
    c.save();
    c.translate(bx, by);
    if(squashed) c.scale(1, .38);
    c.fillStyle = "#ff9ec4";
    c.strokeStyle = "rgba(120,20,70,.45)"; c.lineWidth = 1.3;
    for(const s of [-1, 1]){
      c.beginPath();
      c.moveTo(s*4, -2);
      c.quadraticCurveTo(s*26, -12 - flap*12, s*31, 6 + flap*5);
      c.quadraticCurveTo(s*16, 2, s*4, 5);
      c.closePath(); c.fill(); c.stroke();
    }
    const g = c.createRadialGradient(-3, -6, 2, 0, 0, 16);
    g.addColorStop(0, "#ffd6e6"); g.addColorStop(1, "#dc4d88");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, 12, 11.5, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(110,15,65,.5)"; c.lineWidth = 1.4; c.stroke();
    if(!squashed){
      const look = (this.player && this.player.x < e.x) ? -1 : 1;
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(-4.6, -1.5, 3.5, 0, 7); c.fill();
      c.beginPath(); c.arc( 4.6, -1.5, 3.5, 0, 7); c.fill();
      c.fillStyle = "#3a1030";
      c.beginPath(); c.arc(-4.6 + look*1.1, -1.2, 1.9, 0, 7); c.fill();
      c.beginPath(); c.arc( 4.6 + look*1.1, -1.2, 1.9, 0, 7); c.fill();
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(-5.1 + look*1.1, -2.2, .8, 0, 7); c.fill();
      c.beginPath(); c.arc( 4.1 + look*1.1, -2.2, .8, 0, 7); c.fill();
      c.fillStyle = "#fff";
      c.beginPath(); c.moveTo(-2.6, 5.5); c.lineTo(-1, 9.5); c.lineTo(0.6, 5.5); c.closePath(); c.fill();
      c.beginPath(); c.moveTo(1.6, 5.5); c.lineTo(3.2, 9.5); c.lineTo(4.8, 5.5); c.closePath(); c.fill();
    }
    c.restore();
  },

  /* --- 主角 Pip --- */
  drawPlayer(c){
    const p = this.player;
    if(p.invuln>0 && Math.floor(this.t/70)%2===0) return;
    const cx = p.x + p.w/2, by = p.y + p.h;
    const SQ = p.squash;                       // <0 拉伸, >0 压扁
    const SX = p.big ? BIG.w/SMALL.w : 1;      // 变大蘑菇：整体放大 1.18 × 1.5
    const SY = p.big ? BIG.h/SMALL.h : 1;
    const sx = (1 - SQ*0.55) * SX, sy = (1 + SQ*0.55) * SY;
    const spin = p.star>0 ? Math.sin(this.t/90)*0.09 : 0;

    c.save();
    c.translate(cx, by);
    c.rotate(spin);
    c.scale(sx, sy);

    // 影子
    c.fillStyle = "rgba(0,0,0,.18)";
    c.beginPath(); c.ellipse(0, 1, 12, 4, 0,0,7); c.fill();

    const step = Math.sin(p.anim) * (p.onGround && Math.abs(p.vx)>16 ? 1 : 0);
    // 脚
    c.fillStyle = "#3b2f4a";
    c.beginPath(); c.ellipse(-6.5 + step*2.6, -3.5, 5.6, 3.6, 0,0,7); c.fill();
    c.beginPath(); c.ellipse( 6.5 - step*2.6, -3.5, 5.6, 3.6, 0,0,7); c.fill();

    // 身体
    const bw = 12.5, bh = 14.5;
    const g = c.createRadialGradient(-4, -20, 3, 0, -17, 22);
    if(p.star>0){
      const hue = (this.t/6)%360;
      g.addColorStop(0, `hsl(${hue},100%,88%)`);
      g.addColorStop(1, `hsl(${(hue+70)%360},95%,62%)`);
    } else {
      g.addColorStop(0,"#fffaf2"); g.addColorStop(.65,"#ffe9d2"); g.addColorStop(1,"#f0c9a4");
    }
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, -bh-1.5, bw, bh, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(90,60,40,.32)"; c.lineWidth = 1.4; c.stroke();

    // 围巾
    const flap = Math.sin(this.t/120) * 3 + (-p.vx*0.035);
    c.fillStyle = "#ff7a45";
    c.beginPath();
    c.moveTo(-11, -14);
    c.quadraticCurveTo(0, -10.5, 11, -14);
    c.quadraticCurveTo(0, -17.5, -11, -14);
    c.closePath(); c.fill();
    c.beginPath();
    c.moveTo(-9, -14.5);
    c.quadraticCurveTo(-20-flap, -12+flap*0.6, -26-flap*1.5, -4+flap);
    c.quadraticCurveTo(-18-flap, -10, -8, -11.5);
    c.closePath(); c.fill();

    // 眼睛
    const blink = p.blink>0;
    const lookX = p.facing * 1.6;
    c.fillStyle = "#2b2233";
    if(blink){
      c.fillRect(-6.5, -24, 5, 1.8);
      c.fillRect( 1.5, -24, 5, 1.8);
    } else {
      c.beginPath(); c.ellipse(-4 + lookX, -24, 3.4, 4.2, 0,0,7); c.fill();
      c.beginPath(); c.ellipse( 4 + lookX, -24, 3.4, 4.2, 0,0,7); c.fill();
      c.fillStyle = "#fff";
      c.beginPath(); c.arc(-4.9+lookX, -25.6, 1.3, 0, 7); c.fill();
      c.beginPath(); c.arc( 3.1+lookX, -25.6, 1.3, 0, 7); c.fill();
    }
    // 腮红
    c.fillStyle = "rgba(255,140,140,.4)";
    c.beginPath(); c.ellipse(-9, -19, 3, 2, 0,0,7); c.fill();
    c.beginPath(); c.ellipse( 9, -19, 3, 2, 0,0,7); c.fill();
    // 天线
    c.strokeStyle = "#ff7a45"; c.lineWidth=2; c.lineCap="round";
    c.beginPath(); c.moveTo(0,-bh*2+0.5); c.quadraticCurveTo(2.5,-bh*2-6, 0.5,-bh*2-9); c.stroke();
    c.fillStyle = p.star>0 ? "#fff3a8" : "#ffd257";
    c.beginPath(); c.arc(0.5,-bh*2-10.5, 3.1, 0, 7); c.fill();

    c.restore();

    // 无敌光环
    if(p.star>0){
      const a = .35 + .25*Math.sin(this.t/90);
      c.strokeStyle = `rgba(255,230,120,${a})`; c.lineWidth = 3;
      c.beginPath(); c.ellipse(cx, by-16, 20, 25, 0,0,7); c.stroke();
    }
  },

  drawVignette(c,T){
    const g = c.createRadialGradient(VW/2,VH/2,VH*0.4, VW/2,VH/2,VH*0.95);
    g.addColorStop(0,"rgba(0,0,0,0)");
    g.addColorStop(1, T.crystal ? "rgba(0,0,10,.55)" : "rgba(0,0,20,.3)");
    c.fillStyle = g; c.fillRect(0,0,VW,VH);
  }
};

/* ------------------------------ 启动 ------------------------------ */
Game.init();

// 标题界面按任意键开始（键盘路径）
addEventListener("keydown", ()=>{
  if(Game.state==="title"){ Audio_.init(); Audio_.resume(); Game.lives=3; Game.score=0; Game.coins=0; Game.loadLevel(0); Game.state="play"; Audio_.musicStart(); Game.hideOverlay(); }
  else if(Game.state==="win"||Game.state==="gameover"){ Game.state="title"; Game.showTitle(); }
});
// 关卡切换提示：任意键继续
addEventListener("keydown", ()=>{
  if(Game.pendingStart){ Game.pendingStart=false; Game.hideOverlay(); }
});
addEventListener("pointerdown", ()=>{ if(Game.pendingStart){ Game.pendingStart=false; Game.hideOverlay(); } });

window.addEventListener("resize", ()=>{ /* canvas 由 CSS 缩放，无需处理 */ });
</script>
</body>
