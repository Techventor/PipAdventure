      vy: 0,
      t: rnd(0, 6.28),
      squashTimer: 0,
      anim: 0, turnTimer: 0,
      shellState: "walking", // "walking", "shell_idle", "shell_rolling"
      spitTimer: rnd(1.0, 2.5),
      scissorTimer: rnd(0.5, 2.0),
      scissorH: 0
    }));

    this.platforms = this.currentLevel.platforms.map(p => ({ ...p, dx: 0, dy: 0 }));
    this.pops = [];
    projectiles.length = 0;
    this.camX = 0;
    this.shake = 0;
    particles.length = 0;
    brickDebris.length = 0;
    floaters.length = 0;
    fireworks.length = 0;
    this.updateSkillBadge();

    if (!silent) {
      this.state = "play";
      AudioSys.musicStart(this.currentLevelIdx);
    }
  },

  restartLevel() {
    if (this.state === "play" || this.state === "dead" || this.state === "paused") {
      this.loadLevel(this.currentLevelIdx);
      AudioSys.musicStart(this.currentLevelIdx);
    }
  },

  bindOverlayEvents() {
    const overlay = document.getElementById("overlay");
    overlay.addEventListener("pointerdown", () => {
      AudioSys.init();
      AudioSys.resume();
      Input.anyPressed = true;
      if (this.state === "title") {
        this.lives = 3;
        this.score = 0;
        this.coins = 0;
        this.loadLevel(0);
        this.state = "play";
        AudioSys.musicStart(0);
        this.hideOverlay();
      } else if (this.state === "win" || this.state === "gameover") {
        this.state = "title";
        this.showTitle();
      }
    });
  },

  togglePause() {
    if (this.state !== "play") return;
    this.paused = !this.paused;
    if (this.paused) {
      AudioSys.musicStop();
      this.showCard(`
        <h2>游戏暂停</h2>
        <p class="dim">按 P 继续 · R 重来 · M 静音</p>
        <button class="btn-action" onclick="Game.togglePause()">继续冒险</button>
      `);
    } else {
      AudioSys.musicStart(this.currentLevelIdx);
      this.hideOverlay();
    }
  },

  toggleMute() {
    this.muted = !this.muted;
    AudioSys.init();
    AudioSys.muted = this.muted;
    if (AudioSys.master) AudioSys.master.gain.value = this.muted ? 0 : 0.45;
    showFloatText(this.player.x, this.player.y - 35, this.muted ? "已静音" : "开启声音", "#9fe8ff");
  },

  showCard(html) {
    document.getElementById("card-content").innerHTML = html;
    document.getElementById("overlay").classList.add("show");
  },
  hideOverlay() {
    document.getElementById("overlay").classList.remove("show");
  },

  showTitle() {
    AudioSys.musicStop();
    this.showCard(`
      <h1>Pip 与大鹈鹕的冒险</h1>
      <p style="color:var(--gold); font-weight:700;">马里奥风全新大作 · 终点城堡 · 神奇神技</p>
      <div class="features-pills">
        <span class="pill">🏰 终点城堡与通关礼炮</span>
        <span class="pill">✂️ 管道剪刀怪</span>
        <span class="pill">🐢 缩壳踢击滚壳兽</span>
        <span class="pill">🔥 烈焰喷吐蜥</span>
        <span class="pill">👄 鹈鹕大口吞怪</span>
        <span class="pill">🌀 双翼狂暴飓风</span>
        <span class="pill">🎭 拟态伪装神技</span>
      </div>
      <div class="keys-grid">
        <div class="key-row"><kbd>A</kbd><kbd>D</kbd><span>移动奔跑</span></div>
        <div class="key-row"><kbd>W</kbd><kbd>空格</kbd><span>跳跃/扑翼</span></div>
        <div class="key-row"><kbd>S</kbd><span>空中下砸冲击波</span></div>
        <div class="key-row"><kbd>J</kbd><kbd>Z</kbd><span>释放技能/吞吐</span></div>
      </div>
      <button class="btn-action">点击或按任意键出发！</button>
      <p class="dim" style="margin-top:0.8em">历史最高分: <b style="color:var(--gold)">${this.bestScore}</b></p>
    `);
  },

  /* ------------------------------ 主循环 ------------------------------ */
  loop(ts) {
    const dt = Math.min(0.05, (ts - this.lastTime) / 1000 || 0);
    this.lastTime = ts;
    if (!this.paused) this.update(dt);
    this.render();
    requestAnimationFrame(t2 => this.loop(t2));
  },

  /* ------------------------------ 逻辑更新 ------------------------------ */
  update(dt) {
    this.stateTimer += dt;
    if (this.state === "title") return;

    updateParticles(dt);
    updateFireworks(dt);
    updateBrickDebris(dt);
    updateFloaters(dt);

    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 3.5);

    // 方块顶击动画
    for (const [k, bump] of this.currentLevel.bumps) {
      bump.timer -= dt;
      if (bump.timer <= 0) this.currentLevel.bumps.delete(k);
    }

    // 终点旗杆降落 + 自动走向城堡 + 城堡升旗与漫天礼花盛宴演出
    if (this.state === "levelclear") {
      this.goalTimer += dt;
      const p = this.player;
      const gy = this.currentLevel.goal.y;
      const poleBottom = gy + 26;
      const castleDoorX = this.currentLevel.castleX + 46;

      if (this.goalTimer < 1.2) {
        // 阶段 1：沿旗杆平滑滑落
        const progress = clamp(this.goalTimer / 1.1, 0, 1);
        const easeVal = progress * progress * (3 - 2 * progress);
        this.currentLevel.flagDrop = easeVal;
        p.x = p.poleX;
        p.y = lerp(p.slideFrom, poleBottom - p.h, easeVal);
        p.animCycle += dt * 8;
        if (progress >= 1 && !p.landed) {
          p.landed = true;
          p.squash = 0.35;
          addParticles(p.x + p.w / 2, p.y + p.h, 16, "#ffd257", 160, 0.7, 4);
          AudioSys.coin();
        }
      } else if (this.goalTimer < 3.2) {
        // 阶段 2：跳下旗杆，昂首阔步走向宏伟城堡！
        p.onGround = true;
        p.facing = 1;
        p.animCycle += dt * 10;
        p.x += 115 * dt;

        // 进入城堡大门时逐渐隐入城门
        if (p.x >= castleDoorX) {
          p.hiddenInCastle = true;
          // 城堡顶部的胜利旗帜冉冉升起！
          this.currentLevel.castleFlag = clamp((this.goalTimer - 2.0) / 0.8, 0, 1);
        }

        // 城堡上空燃放庆典礼花！
        this.fireworkTimer += dt;
        if (this.fireworkTimer > 0.32) {
          this.fireworkTimer = 0;
          spawnFirework(this.currentLevel.castleX + rnd(10, 80), gy - rnd(90, 170));
        }

        // 剩余时间换算分数
        if (this.timeLeft > 0) {
          this.score += 50;
          this.timeLeft = Math.max(0, this.timeLeft - dt * 90);
        }
      } else if (this.goalTimer > 4.2) {
        this.nextLevel();
      }

      this.updateCamera(dt);
      return;
    }

    // 死亡演出
    if (this.state === "dead") {
      const p = this.player;
      p.deadTime += dt;
      p.vy += 2200 * dt;
      p.y += p.vy * dt;
      if (p.deadTime > 1.6) {
        this.lives--;
        if (this.lives <= 0) {
          this.state = "gameover";
          this.saveBestScore();
          this.showCard(`
            <h2>游戏结束</h2>
            <p>鹈鹕骑士英勇地倒下了……</p>
            <div class="score-badge">最终得分 <b>${this.score}</b></div>
            <p class="blink">点击或按任意键重回标题</p>
          `);
        } else {
          this.loadLevel(this.currentLevelIdx);
          AudioSys.musicStart(this.currentLevelIdx);
        }
      }
      return;
    }

    if (this.state !== "play") return;
    if (this.pendingTransition) {
      Input.jumpBuffer = 0;
      return;
    }

    // 倒计时
    this.timeLeft -= dt * 0.9;
    if (this.timeLeft <= 0) {
      this.killPlayer();
      return;
    }

    this.updatePlatforms(dt);
    this.updateProjectiles(dt);
    this.updateEntities(dt);
    this.updatePlayer(dt);
    this.updateCamera(dt);

    if (this.player.y > VH + 100 && this.state === "play") {
      this.killPlayer();
    }

    // HUD 刷新
    document.getElementById("hud-score").textContent = String(this.score).padStart(6, "0");
    document.getElementById("hud-coins").textContent = `x ${String(this.coins).padStart(2, "0")}`;
    document.getElementById("hud-level").textContent = `1-${this.currentLevelIdx + 1}`;
    document.getElementById("hud-time").textContent = Math.max(0, Math.ceil(this.timeLeft));

    const livesBox = document.getElementById("lives-box");
    if (livesBox.childElementCount !== Math.max(0, this.lives)) {
      livesBox.innerHTML = "";
      for (let i = 0; i < Math.max(0, this.lives); i++) {
        const d = document.createElement("div");
        d.className = "pelican-icon";
        livesBox.appendChild(d);
      }
    }
  },

  nextLevel() {
    this.saveBestScore();
    if (this.currentLevelIdx + 1 >= this.levels.length) {
      this.state = "win";
      AudioSys.win();
      AudioSys.musicStop();
      this.showCard(`
        <h2>🎉 全大关胜利通关！</h2>
        <p>你和神勇大鹈鹕成功完成了三重大冒险，征服了所有城堡！</p>
        <div class="score-badge">总得分 <b>${this.score}</b></div>
        <p class="dim">最高纪录: ${this.bestScore}</p>
        <button class="btn-action" onclick="Game.state='title'; Game.showTitle();">凯旋回城</button>
      `);
    } else {
      this.loadLevel(this.currentLevelIdx + 1);
      this.state = "play";
      AudioSys.musicStart(this.currentLevelIdx);
      this.showCard(`
        <h2>第 1-${this.currentLevelIdx} 关城堡占领！</h2>
        <p>前方进入：<b style="color:var(--teal)">${this.currentLevel.theme.name}</b></p>
        <button class="btn-action" onclick="Game.pendingTransition=false; Game.hideOverlay();">继续前进</button>
      `);
      this.pendingTransition = true;
    }
  },

  saveBestScore() {
    if (this.score > this.bestScore) {
      this.bestScore = this.score;
      try {
        localStorage.setItem("pip_pelican_best", String(this.bestScore));
      } catch (e) {}
    }
  },

  /* ------------------------------ 释放神技系统 ------------------------------ */
  useSkill() {
    const p = this.player;
    if (!p || p.dead || this.state !== "play") return;

    // 1. 鹈鹕大口吞噬 / 吐出技能
    if (p.power === "gulp") {
      if (p.swallowedEnemy) {
        // 嘴里有怪：猛烈喷吐出高能炮弹！
        AudioSys.spit();
        p.squash = -0.4;
        addProjectile("spit_egg", p.x + (p.facing > 0 ? p.w + 10 : -14), p.y + p.h / 2 - 8, p.facing * 520, -120);
        showFloatText(p.x, p.y - 25, "巨喉喷射！", "#ffd257", 1.2);
        p.swallowedEnemy = null;
        this.updateSkillBadge();
      } else {
        // 张开大嘴扑吞前方敌人
        AudioSys.gulp();
        p.squash = 0.35;
        p.pouchInertia = 1.0;
        // 判定前方扇形范围内的怪
        const reachX = p.facing > 0 ? p.x + p.w : p.x - 45;
        const box = { x: reachX, y: p.y - 6, w: 45, h: p.h + 12 };
        for (const e of this.entities) {
          if (e.alive && (e.type === "walker" || e.type === "shell_beast" || e.type === "spitter" || e.type === "flyer")) {
            if (this.checkAABB(box, e)) {
              e.alive = false;
              p.swallowedEnemy = e.type;
              showFloatText(p.x, p.y - 25, "含入口中！按 [J] 喷吐！", "#4fe3c1", 1.2);
              addParticles(e.x + 10, e.y + 10, 14, "#ffeaa7", 120, 0.5, 4);
              this.updateSkillBadge();
              break;
            }
          }
        }
      }
    }
    // 2. 双翼狂暴飓风
    else if (p.power === "wind") {
      AudioSys.windGust();
      p.squash = -0.3;
      addProjectile("tornado", p.x + (p.facing > 0 ? p.w + 5 : -25), p.y + p.h / 2 - 16, p.facing * 420, 0);
      showFloatText(p.x, p.y - 25, "双翼狂风！", "#74b9ff", 1.2);
    }
    // 3. 喷吐烈焰火球
    else if (p.power === "fire") {
      AudioSys.fireball();
      p.squash = -0.25;
      addProjectile("player_fire", p.x + (p.facing > 0 ? p.w + 4 : -14), p.y + p.h / 2 - 6, p.facing * 380, 120);
    }
  },

  updateSkillBadge() {
    const badge = document.getElementById("skill-badge");
    if (!badge) return;
    const p = this.player;
    if (!p || !p.power) {
      badge.style.display = "none";
      return;
    }
    badge.style.display = "inline-flex";
    if (p.power === "gulp") {
      badge.innerHTML = p.swallowedEnemy ? "👄 嘴含怪兽！按 [J] 吐出" : "👄 鹈鹕大口吞噬 (按 J)";
      badge.style.borderColor = "#ffd257";
    } else if (p.power === "wind") {
      badge.innerHTML = "🌀 双翼飓风 (按 J)";
      badge.style.borderColor = "#74b9ff";
    } else if (p.power === "fire") {
      badge.innerHTML = "🔥 烈焰吐珠 (按 J)";
      badge.style.borderColor = "#ff7675";
    } else if (p.power === "mimic") {
      badge.innerHTML = `🎭 拟态伪装 ${p.shieldHp > 0 ? '(护甲 x' + p.shieldHp + ')' : '(触怪吸灵)'}`;
      badge.style.borderColor = "#a29bfe";
    }
  },

  /* ------------------------------ 玩家变大 / 变小 ------------------------------ */
  canFit(x, y, w, h) {
    const x0 = Math.floor(x / TILE), x1 = Math.floor((x + w - 1) / TILE);
    const y0 = Math.floor(y / TILE), y1 = Math.floor((y + h - 1) / TILE);
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        if (SOLID.has(this.currentLevel.get(tx, ty))) return false;
      }
    }
    return true;
  },

  growPlayer() {
    const p = this.player;
    if (p.big) {
      this.score += 500;
      showFloatText(p.x, p.y - 25, "+500", "#ffd257", 1.2);
      AudioSys.coin();
      return true;
    }
    const bW = PHYS.big.w, bH = PHYS.big.h;
    const nx = p.x + p.w / 2 - bW / 2;
    const ny = p.y - (bH - p.h);
    if (!this.canFit(nx, ny, bW, bH)) return false;

    p.big = true;
    p.w = bW; p.h = bH;
    p.x = nx; p.y = ny;
    p.squash = -0.35;
    this.score += 1000;
    AudioSys.grow();
    showFloatText(p.x + p.w / 2, p.y - 25, "超级鹈鹕骑士形态！", "#4fe3c1", 1.3);
    addParticles(p.x + p.w / 2, p.y + p.h / 2, 24, "#ffd257", 200, 1.0, 5);
    return true;
  },

  shrinkPlayer() {
    const p = this.player;
    if (p.shieldHp > 0) {
      p.shieldHp--;
      p.invuln = 1.8;
      AudioSys.hurt();
      showFloatText(p.x, p.y - 25, "护甲抵挡伤害！", "#ffeaa7");
      this.updateSkillBadge();
      return;
    }
    if (!p.big) return;
    const sW = PHYS.small.w, sH = PHYS.small.h;
    p.big = false;
    const cx = p.x + p.w / 2;
    p.w = sW; p.h = sH;
    p.x = cx - sW / 2;
    p.y += (PHYS.big.h - sH);
    p.invuln = 2.0;
    p.squash = 0.35;
    AudioSys.shrink();
    showFloatText(p.x + p.w / 2, p.y - 25, "恢复普通形态", "#ff9ec4");
    addParticles(p.x + p.w / 2, p.y + p.h / 2, 16, "#ffffff", 140, 0.7, 3.5);
  },

  /* ------------------------------ 摄像机 ------------------------------ */
  updateCamera(dt) {
    const p = this.player;
    const lookAhead = p.facing * 40;
    const target = clamp(p.x + p.w / 2 + lookAhead - VW * 0.44, 0, this.currentLevel.w * TILE - VW);
    this.camX = lerp(this.camX, target, 1 - Math.pow(0.001, dt));
  },

  /* ------------------------------ 移动平台 ------------------------------ */
  updatePlatforms(dt) {
    for (const pl of this.platforms) {
      const prevX = pl.x, prevY = pl.y;
      pl.t += dt * (pl.speed / 100);
      const wave = (Math.sin(pl.t) + 1) / 2;
      pl.x = lerp(pl.ax, pl.bx, wave);
      pl.y = lerp(pl.ay, pl.by, wave);
      pl.dx = pl.x - prevX;
      pl.dy = pl.y - prevY;
    }
  },

  /* ------------------------------ 投掷物更新 ------------------------------ */
  updateProjectiles(dt) {
    for (let i = projectiles.length - 1; i >= 0; i--) {
      const proj = projectiles[i];
      proj.life -= dt;
      if (proj.life <= 0) {
        projectiles.splice(i, 1);
        continue;
      }

      proj.x += proj.vx * dt;
      proj.y += proj.vy * dt;

      // 玩家火球反弹机制
      if (proj.type === "player_fire") {
        proj.vy += 1200 * dt;
        const tx = Math.floor(proj.x / TILE);
        const ty = Math.floor((proj.y + proj.h) / TILE);
        if (SOLID.has(this.currentLevel.get(tx, ty))) {
          proj.y = ty * TILE - proj.h;
          proj.vy = -260; // 弹跳
          addParticles(proj.x, proj.y + proj.h, 3, "#e17055", 60, 0.2, 2.5);
        }
      }

      // 吐出的蛋形怪兽炮弹
      if (proj.type === "spit_egg") {
        proj.vy += 1000 * dt;
        addParticles(proj.x, proj.y, 1, "#ffeaa7", 40, 0.2, 2.5);
      }

      // 判定命中敌人
      if (proj.type === "player_fire" || proj.type === "spit_egg" || proj.type === "tornado") {
        for (const e of this.entities) {
          if (e.alive && (e.type === "walker" || e.type === "shell_beast" || e.type === "spitter" || e.type === "flyer" || e.type === "scissor")) {
            if (this.checkAABB(proj, e)) {
              e.alive = false;
              e.squashTimer = 0.01;
              this.score += 250;
              showFloatText(e.x, e.y - 20, "击败! +250", "#ffd257");
              addParticles(e.x, e.y, 16, "#e74c3c", 160, 0.6, 4);
              AudioSys.stomp();
              if (proj.type === "player_fire") {
                projectiles.splice(i, 1);
                break;
              }
            }
          }
        }
      }
      // 敌方吐出的火球命中玩家
      else if (proj.type === "enemy_fire") {
        if (this.checkAABB(proj, this.player)) {
          this.hurtPlayer();
          projectiles.splice(i, 1);
        }
      }
    }
  },

  /* ------------------------------ 玩家运动物理 ------------------------------ */
  updatePlayer(dt) {
    const p = this.player;
    if (p.dead) return;

    if (p.invuln > 0) p.invuln -= dt;
    if (p.stompGrace > 0) p.stompGrace -= dt;
    if (p.pouchInertia > 0) p.pouchInertia -= dt * 2.5;
    if (p.star > 0) {
      p.star -= dt;
      if (p.star <= 0) showFloatText(p.x, p.y - 35, "无敌结束", "#ffd257");
    }

    const curPhys = p.big ? PHYS.big : PHYS.small;

    // 空中下砸
    if (!p.onGround && Input.down && !p.pounding && p.vy > -100) {
      p.pounding = true;
      p.poundStall = 0.16;
      p.vx = 0; p.vy = 0;
      AudioSys.wingFlap();
      addParticles(p.x + p.w / 2, p.y + p.h / 2, 10, "#ffffff", 120, 0.3, 3);
    }

    if (p.pounding) {
      if (p.poundStall > 0) {
        p.poundStall -= dt;
        p.vx = 0; p.vy = 0;
        return;
      }
      p.vy = 950;
    } else {
      const dir = (Input.right ? 1 : 0) - (Input.left ? 1 : 0);
      const acc = p.onGround ? curPhys.accGnd : curPhys.accAir;
      const fric = p.onGround ? curPhys.fricGnd : curPhys.fricAir;
      const speedCap = curPhys.maxRun * (p.star > 0 ? 1.25 : 1);

      if (dir !== 0) {
        p.vx += dir * acc * dt;
        p.facing = dir;
      } else {
        const f = fric * dt;
        if (Math.abs(p.vx) <= f) p.vx = 0;
        else p.vx -= Math.sign(p.vx) * f;
      }
      p.vx = clamp(p.vx, -speedCap, speedCap);

      if (p.onGround) p.coyote = COYOTE_TIME;
      else p.coyote -= dt;

      if (Input.jumpBuffer > 0) Input.jumpBuffer -= dt;

      if (Input.jumpBuffer > 0 && p.coyote > 0) {
        p.vy = -curPhys.jump;
        p.onGround = false;
        p.coyote = 0;
        Input.jumpBuffer = 0;
        p.squash = -0.32;
        AudioSys.jump(p.big);
        AudioSys.wingFlap();
        addParticles(p.x + p.w / 2, p.y + p.h, 8, "rgba(255,255,255,0.7)", 90, 0.4, 3);
      }

      if (!Input.jump && p.vy < -curPhys.jumpCut) {
        p.vy = -curPhys.jumpCut;
      }

      p.vy += curPhys.grav * dt;
      if (p.vy > curPhys.maxFall) p.vy = curPhys.maxFall;
    }

    if (p.ridePlatform && p.ridePlatform.dx !== undefined) {
      p.x += p.ridePlatform.dx;
      p.y += p.ridePlatform.dy;
    }

    p.squash = lerp(p.squash, 0, 1 - Math.pow(0.001, dt));

    this.movePlayerX(p, dt);
    this.movePlayerY(p, dt);

    p.animCycle += (p.onGround && Math.abs(p.vx) > 15) ? (dt * Math.abs(p.vx) / 16) : (dt * 3);
    p.blinkTimer -= dt;
    if (p.blinkTimer <= 0) {
      p.blinking = true;
      p.blinkTimer = rnd(2.5, 5);
      setTimeout(() => { if (this.player) this.player.blinking = false; }, 140);
    }

    this.hitEntities(p);

    // 终点旗杆判定
    const gx = this.currentLevel.goal.x + 8;
    const gy = this.currentLevel.goal.y;
    if (p.x + p.w > gx - 10 && p.x < gx + 36 && p.y + p.h > gy - 130) {
      this.state = "levelclear";
      this.goalTimer = 0;
      p.vx = 0; p.vy = 0;
      p.pounding = false;
      p.ridePlatform = null;
      p.poleX = gx + 10 - p.w / 2;
      p.x = p.poleX;
      p.slideFrom = p.y;
      p.landed = false;
      p.hiddenInCastle = false;
      this.score += 500;
      AudioSys.clear();
      AudioSys.musicStop();
      this.shake = 0.25;
    }
  },

  movePlayerX(p, dt) {
    p.x += p.vx * dt;
    const y0 = Math.floor((p.y + 2) / TILE);
    const y1 = Math.floor((p.y + p.h - 3) / TILE);

    if (p.vx > 0) {
      const tx = Math.floor((p.x + p.w - 1) / TILE);
      for (let y = y0; y <= y1; y++) {
        if (SOLID.has(this.currentLevel.get(tx, y))) {
          p.x = tx * TILE - p.w;
          p.vx = 0;
          break;
        }
      }
    } else if (p.vx < 0) {
      const tx = Math.floor(p.x / TILE);
      for (let y = y0; y <= y1; y++) {
        if (SOLID.has(this.currentLevel.get(tx, y))) {
          p.x = (tx + 1) * TILE;
          p.vx = 0;
          break;
        }
      }
    }

    for (const pl of this.platforms) {
      if (this.checkAABB(p, pl)) {
        if (p.vx > 0) p.x = pl.x - p.w;
        else if (p.vx < 0) p.x = pl.x + pl.w;
        p.vx = 0;
      }
    }
  },

  movePlayerY(p, dt) {
    const wasGnd = p.onGround;
    p.onGround = false;
    p.ridePlatform = null;
    const prevBottom = p.y + p.h;
    p.y += p.vy * dt;

    const x0 = Math.floor(p.x / TILE);
    const x1 = Math.floor((p.x + p.w - 1) / TILE);

    if (p.vy > 0) {
      const ty = Math.floor((p.y + p.h) / TILE);
      for (let x = x0; x <= x1; x++) {
        const t = this.currentLevel.get(x, ty);
        const isSolid = SOLID.has(t) || (t === PLATFORM && prevBottom <= ty * TILE + 8);
        if (!isSolid) continue;

        p.y = ty * TILE - p.h;
        p.vy = 0;
        p.onGround = true;

        if (!wasGnd) {
          p.squash = 0.35;
          addParticles(p.x + p.w / 2, p.y + p.h, 6, "rgba(255,255,255,0.6)", 100, 0.35, 3);
          if (p.pounding) {
            p.pounding = false;
            this.shake = 0.55;
            AudioSys.groundPound();
            addParticles(p.x + p.w / 2, p.y + p.h, 28, "#ffd257", 220, 0.6, 5);
            for (const e of this.entities) {
              if (e.alive && (e.type === "walker" || e.type === "shell_beast") && Math.abs(e.x - (p.x + p.w / 2)) < 110 && Math.abs(e.y - p.y) < 60) {
                e.squashTimer = 0.3;
                e.alive = false;
                this.score += 200;
                showFloatText(e.x, e.y - 20, "冲击波! +200", "#ffd257");
                addParticles(e.x, e.y, 14, "#ffffff", 160, 0.5, 4);
              }
            }
          }
        }
        break;
      }

      for (const pl of this.platforms) {
        if (p.x + p.w > pl.x + 2 && p.x < pl.x + pl.w - 2 && prevBottom <= pl.y + 6 && p.y + p.h >= pl.y) {
          p.y = pl.y - p.h;
          p.vy = 0;
          p.onGround = true;
          p.ridePlatform = pl;
          if (p.pounding) p.pounding = false;
        }
      }
    } else if (p.vy < 0) {
      const ty = Math.floor(p.y / TILE);
      let hitX = -1, minDistance = 9999;
      for (let x = x0; x <= x1; x++) {
        const tileType = this.currentLevel.get(x, ty);
        if (SOLID.has(tileType) || tileType === HIDDEN_BRICK) {
          const dist = Math.abs((x * TILE + 16) - (p.x + p.w / 2));
          if (dist < minDistance) {
            minDistance = dist;
            hitX = x;
          }
        }
      }
      if (hitX >= 0) {
        p.y = (ty + 1) * TILE;
        p.vy = 0;
        this.hitHeadBlock(hitX, ty);
      }
    }

    if (this.state === "play") {
      const cy = Math.floor((p.y + p.h - 6) / TILE);
      for (let x = x0; x <= x1; x++) {
        if (this.currentLevel.get(x, cy) === SPIKE || this.currentLevel.get(x, cy + 1) === SPIKE) {
          this.hurtPlayer();
          break;
        }
      }
    }
  },

  checkAABB(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  },

  /* ------------------------------ 顶方块与隐藏砖块 ------------------------------ */
  hitHeadBlock(tx, ty) {
    const t = this.currentLevel.get(tx, ty);
    const p = this.player;

    // 1. 隐藏砖块：撞碎或揭示
    if (t === HIDDEN_BRICK) {
      this.currentLevel.set(tx, ty, USED);
      this.currentLevel.bumps.set(`${tx},${ty}`, { timer: 0.22, power: 1.0 });
      AudioSys.bump();
      AudioSys.powerupAppear();
      addParticles(tx * TILE + 16, ty * TILE + 8, 20, "#ffd257", 180, 0.7, 4.5);
      showFloatText(tx * TILE + 16, ty * TILE - 20, "发现隐藏砖块！", "#4fe3c1", 1.2);
      const content = this.currentLevel.hiddenContent.get(`${tx},${ty}`) || "flower";
      this.spawnBlockPop(tx, ty, content);
      return;
    }

    // 2. 问号箱
    if (t === QUESTION) {
      this.currentLevel.set(tx, ty, USED);
      this.currentLevel.bumps.set(`${tx},${ty}`, { timer: 0.22, power: 1.0 });
      addParticles(tx * TILE + 16, ty * TILE + 8, 14, "#ffeaa7", 140, 0.5, 4);

      const content = this.currentLevel.questionContent.get(`${tx},${ty}`) || (p.big ? "flower" : "mush");
      this.spawnBlockPop(tx, ty, content);
      AudioSys.bump();
    }
    // 3. 普通砖块
    else if (t === BRICK) {
      if (p.big || p.star > 0) {
        this.currentLevel.set(tx, ty, EMPTY);
        spawnBrickShatter(tx * TILE + 16, ty * TILE + 16, this.currentLevel.theme.brick, this.currentLevel.theme.brickLine);
        this.score += 50;
        this.shake = Math.max(this.shake, 0.4);
        AudioSys.shatter();
      } else {
        this.currentLevel.bumps.set(`${tx},${ty}`, { timer: 0.18, power: 0.7 });
        addParticles(tx * TILE + 16, ty * TILE + 30, 5, this.currentLevel.theme.brickLine, 90, 0.35, 3);
        AudioSys.bump();
      }
    } else {
      this.currentLevel.bumps.set(`${tx},${ty}`, { timer: 0.16, power: 0.45 });
      AudioSys.bump();
    }
  },

  spawnBlockPop(tx, ty, kind) {
    this.pops.push({ x: tx * TILE + 16, y: ty * TILE, vy: -320, kind, timer: 0 });
  },

  updatePops(dt) {
    if (!this.pops) return;
    for (let i = this.pops.length - 1; i >= 0; i--) {
      const pop = this.pops[i];
      pop.timer += dt;
      if (pop.timer < 0.28) {
        pop.y += pop.vy * dt;
        pop.vy += 1300 * dt;
      } else if (pop.kind === "coin") {
        this.coins++;
        this.score += 200;
        AudioSys.coin();
        showFloatText(pop.x - 12, pop.y - 25, "+200", "#ffd257", 1.2);
        addParticles(pop.x, pop.y, 8, "#ffd257", 100, 0.5, 3.5);
        this.pops.splice(i, 1);
      } else {
        this.entities.push({
          type: pop.kind,
          x: pop.x - 13, y: pop.y - 4,
          w: 26, h: 26,
          ox: pop.x - 13, oy: pop.y - 4,
          vx: pop.kind === "mush" ? 75 : 95,
          vy: 0,
          alive: true, t: 0, squashTimer: 0, anim: 0, turnTimer: 0
        });
        AudioSys.powerupAppear();
        this.pops.splice(i, 1);
      }
    }
  },

  /* ------------------------------ 实体更新 ------------------------------ */
  updateEntities(dt) {
    this.updatePops(dt);
    const p = this.player;

    for (const e of this.entities) {
      if (!e.alive) continue;
      e.t += dt;

      if (e.type === "coin") continue;

      // 1. 管道剪刀怪 (Scissor Plant)
      if (e.type === "scissor") {
        e.scissorTimer -= dt;
        const distToPlayer = Math.abs((p.x + p.w / 2) - (e.x + 12));
        // 如果玩家离管口太近，剪刀怪暂避不出
        if (distToPlayer < 42 && e.state === "hidden") {
          e.scissorTimer = 0.5;
        }

        if (e.state === "hidden") {
          if (e.scissorTimer <= 0) {
            e.state = "rising";
            e.scissorTimer = 1.0;
          }
        } else if (e.state === "rising") {
          e.scissorH = Math.min(32, e.scissorH + dt * 70);
          e.y = e.pipeTopY - e.scissorH;
          if (e.scissorH >= 32) {
            e.state = "snapping";
            e.scissorTimer = 1.2;
          }
        } else if (e.state === "snapping") {
          e.anim += dt * 14; // 疯狂咬牙合拢
          if (e.scissorTimer <= 0) {
            e.state = "descending";
          }
        } else if (e.state === "descending") {
          e.scissorH = Math.max(0, e.scissorH - dt * 70);
          e.y = e.pipeTopY - e.scissorH;
          if (e.scissorH <= 0) {
            e.state = "hidden";
            e.scissorTimer = rnd(1.5, 3.0);
          }
        }
        continue;
      }

      // 2. 滚壳兽 (Shell Beast)
      if (e.type === "shell_beast") {
        if (e.shellState === "shell_rolling") {
          e.x += e.vx * dt;
          e.anim += Math.abs(e.vx) * dt * 0.1;
          const tx = Math.floor((e.vx > 0 ? e.x + e.w : e.x) / TILE);
          const ty = Math.floor((e.y + e.h / 2) / TILE);
          if (SOLID.has(this.currentLevel.get(tx, ty))) {
            e.vx *= -1; // 撞墙猛烈反弹！
            AudioSys.shellKick();
            this.shake = 0.18;
          }
          // 滚壳撞飞路上其他怪物！
          for (const other of this.entities) {
            if (other !== e && other.alive && (other.type === "walker" || other.type === "spitter" || other.type === "flyer")) {
              if (this.checkAABB(e, other)) {
                other.alive = false;
                other.squashTimer = 0.01;
                this.score += 300;
                showFloatText(other.x, other.y - 20, "扫荡! +300", "#ffd257");
                addParticles(other.x, other.y, 14, "#ffffff", 140, 0.5, 4);
                AudioSys.stomp();
              }
            }
          }
          continue;
        } else if (e.shellState === "shell_idle") {
          continue;
        }
      }

      // 3. 喷火火蜥蜴 (Fire Spitter)
      if (e.type === "spitter") {
        e.spitTimer -= dt;
        if (e.spitTimer <= 0) {
          e.spitTimer = rnd(2.4, 3.6);
          const dir = p.x < e.x ? -1 : 1;
          addProjectile("enemy_fire", e.x + (dir > 0 ? 24 : -8), e.y + 4, dir * 180, -60);
          AudioSys.fireball();
        }
      }

      // 4. 道具：变大蘑菇、星星、技能花、拟态球
      if (e.type === "mush" || e.type === "star" || e.type === "flower" || e.type === "mimic") {
        e.vy += 1900 * dt;
        if (e.vy > 900) e.vy = 900;
        e.x += e.vx * dt;
        e.y += e.vy * dt;

        const y0 = Math.floor((e.y + 2) / TILE);
        const y1 = Math.floor((e.y + e.h - 3) / TILE);
        if (e.vx > 0) {
          const tx = Math.floor((e.x + e.w - 1) / TILE);
          for (let y = y0; y <= y1; y++) {
            if (SOLID.has(this.currentLevel.get(tx, y))) {
              e.x = tx * TILE - e.w; e.vx *= -1; break;
            }
          }
        } else if (e.vx < 0) {
          const tx = Math.floor(e.x / TILE);
          for (let y = y0; y <= y1; y++) {
            if (SOLID.has(this.currentLevel.get(tx, y))) {
              e.x = (tx + 1) * TILE; e.vx *= -1; break;
            }
          }
        }
        if (e.vy > 0) {
          const ty = Math.floor((e.y + e.h) / TILE);
          for (let x = Math.floor(e.x / TILE); x <= Math.floor((e.x + e.w - 1) / TILE); x++) {
            const t = this.currentLevel.get(x, ty);
            if (SOLID.has(t) || t === PLATFORM) {
              e.y = ty * TILE - e.h;
              e.vy = (e.type === "star") ? -350 : 0;
              break;
            }
          }
        }
        if (e.y > VH + 200) e.alive = false;
        continue;
      }

      // 5. 地面行走小怪
      if (e.type === "walker" || e.type === "shell_beast" || e.type === "spitter") {
        if (e.squashTimer > 0) {
          e.squashTimer -= dt;
          if (e.squashTimer <= 0) e.alive = false;
          continue;
        }
        if (e.turnTimer > 0) e.turnTimer -= dt;
        e.anim += Math.abs(e.vx) * dt / 7;
        e.vy += 1900 * dt;
        if (e.vy > 900) e.vy = 900;
        e.x += e.vx * dt;
        e.y += e.vy * dt;

        const y0 = Math.floor((e.y + 2) / TILE);
        const y1 = Math.floor((e.y + e.h - 3) / TILE);
        let hitWall = false;
        if (e.vx > 0) {
          const tx = Math.floor((e.x + e.w - 1) / TILE);
          for (let y = y0; y <= y1; y++) {
            if (SOLID.has(this.currentLevel.get(tx, y))) {
              e.x = tx * TILE - e.w; hitWall = true; break;
            }
          }
        } else if (e.vx < 0) {
          const tx = Math.floor(e.x / TILE);
          for (let y = y0; y <= y1; y++) {
            if (SOLID.has(this.currentLevel.get(tx, y))) {
              e.x = (tx + 1) * TILE; hitWall = true; break;
            }
          }
        }
        if (hitWall) {
          e.vx *= -1; e.turnTimer = 0.2;
        }

        const ty = Math.floor((e.y + e.h) / TILE);
        if (e.vy > 0) {
          let landed = false;
          for (let x = Math.floor(e.x / TILE); x <= Math.floor((e.x + e.w - 1) / TILE); x++) {
            if (SOLID.has(this.currentLevel.get(x, ty)) || this.currentLevel.get(x, ty) === PLATFORM) {
              e.y = ty * TILE - e.h; e.vy = 0; landed = true; break;
            }
          }
          if (landed) {
            const lookX = Math.floor((e.x + (e.vx > 0 ? e.w + 4 : -4)) / TILE);
            const lookY = Math.floor((e.y + e.h + 4) / TILE);
            if (!SOLID.has(this.currentLevel.get(lookX, lookY)) && this.currentLevel.get(lookX, lookY) !== PLATFORM && e.turnTimer <= 0) {
              e.vx *= -1; e.turnTimer = 0.25;
            }
          }
        }
        if (e.y > VH + 200) e.alive = false;
        continue;
      }

      // 6. 飞行小怪
      if (e.type === "flyer") {
        if (e.squashTimer > 0) {
          e.squashTimer -= dt;
          if (e.squashTimer <= 0) e.alive = false;
          continue;
        }
        e.x = e.ox + Math.sin(e.t * 1.3) * 45;
        e.y = e.oy + Math.sin(e.t * 2.2) * 25;
        e.anim += dt * 12;
        continue;
      }
    }

    this.entities = this.entities.filter(e => e.alive || e.squashTimer > 0);
  },

  /* ------------------------------ 实体互动与踩怪 ------------------------------ */
  hitEntities(p) {
    if (p.dead) return;
    const vyIn = p.vy;

    for (const e of this.entities) {
      if (!e.alive) continue;

      // 金币拾取
      if (e.type === "coin") {
        if (this.checkAABB(p, { x: e.x - 12, y: e.y - 12, w: 24, h: 24 })) {
          e.alive = false;
          this.coins++;
          this.score += 100;
          AudioSys.coin();
          showFloatText(e.x - 10, e.y - 20, "+100", "#ffd257");
          addParticles(e.x, e.y, 8, "#ffd257", 100, 0.45, 3);
          if (this.coins > 0 && this.coins % 50 === 0) {
            this.lives++;
            showFloatText(p.x, p.y - 45, "奖 1UP!", "#4fe3c1", 1.4);
            AudioSys.powerupAppear();
          }
        }
        continue;
      }

      // 变大蘑菇
      if (e.type === "mush") {
        if (this.checkAABB(p, e)) {
          e.alive = false;
          addParticles(e.x + 13, e.y + 13, 20, "#e74c3c", 160, 0.8, 4.5);
          this.growPlayer();
        }
        continue;
      }

      // 神技奇迹花：随机赋予神技！
      if (e.type === "flower") {
        if (this.checkAABB(p, e)) {
          e.alive = false;
          const skills = ["gulp", "wind", "fire"];
          p.power = skills[Math.floor(Math.random() * skills.length)];
          this.score += 800;
          AudioSys.grow();
          addParticles(e.x + 13, e.y + 13, 24, "#00cec9", 180, 0.9, 4.5);
          const skillNames = { gulp: "鹈鹕巨喉吞噬！", wind: "双翼狂暴飓风！", fire: "烈焰吐火球！" };
          showFloatText(e.x - 20, e.y - 25, `习得：${skillNames[p.power]} 按 [J] 施展`, "#ffd257", 1.3);
          this.updateSkillBadge();
        }
        continue;
      }

      // 拟态宝珠：伪装变身下一个碰到的怪！
      if (e.type === "mimic") {
        if (this.checkAABB(p, e)) {
          e.alive = false;
          p.power = "mimic";
          p.shieldHp = 1;
          this.score += 1000;
          AudioSys.grow();
          addParticles(e.x + 13, e.y + 13, 26, "#a29bfe", 190, 0.9, 5);
          showFloatText(e.x - 20, e.y - 25, "拟态附体！触碰下一个敌人吸收其能力！", "#a29bfe", 1.3);
          this.updateSkillBadge();
        }
        continue;
      }

      // 无敌星星
      if (e.type === "star") {
        if (this.checkAABB(p, e)) {
          e.alive = false;
          p.star = 10.0;
          this.score += 1000;
          AudioSys.grow();
          showFloatText(e.x - 20, e.y - 25, "超能无敌 10秒！", "#ffd257", 1.3);
          addParticles(e.x + 13, e.y + 13, 25, "#ffd257", 180, 0.9, 4.5);
        }
        continue;
      }

      // 滚壳兽在静止状态：碰一下就踢飞！
      if (e.type === "shell_beast" && e.shellState === "shell_idle") {
        if (this.checkAABB(p, e)) {
          e.shellState = "shell_rolling";
          e.vx = p.facing * 480;
          p.vy = -300;
          AudioSys.shellKick();
          showFloatText(e.x, e.y - 20, "踢飞滚壳！", "#ffeaa7");
          continue;
        }
      }

      // 敌人碰撞与踩怪
      if (e.type === "walker" || e.type === "flyer" || e.type === "shell_beast" || e.type === "spitter" || e.type === "scissor") {
        if (e.squashTimer > 0) continue;
        if (!this.checkAABB(p, e)) continue;

        // 拟态机制：如果处于拟态模式，接触敌人直接吸灵变身！
        if (p.power === "mimic") {
          e.alive = false;
          e.squashTimer = 0.01;
          this.score += 500;
          AudioSys.grow();
          addParticles(e.x, e.y, 22, "#a29bfe", 170, 0.8, 4);

          if (e.type === "spitter") {
            p.power = "fire";
            showFloatText(p.x, p.y - 30, "拟态成功：习得烈焰吐珠！", "#ff7675", 1.3);
          } else if (e.type === "shell_beast") {
            p.shieldHp = 2;
            p.power = "wind";
            showFloatText(p.x, p.y - 30, "拟态成功：获坚韧重壳与双翼飓风！", "#4fe3c1", 1.3);
          } else {
            p.shieldHp = 1;
            p.power = "gulp";
            showFloatText(p.x, p.y - 30, "拟态成功：护甲+1 并获大嘴吞噬神技！", "#ffd257", 1.3);
          }
          this.updateSkillBadge();
          continue;
        }

        const isStomp = (vyIn > 60 || p.pounding) && (p.y + p.h) < (e.y + e.h * 0.72) && (e.type !== "scissor");

        if (p.star > 0 || p.pounding) {
          e.squashTimer = 0.001;
          e.alive = false;
          this.score += 300;
          showFloatText(e.x - 8, e.y - 25, "+300", "#ffd257", 1.2);
          addParticles(e.x, e.y, 16, "#ffd257", 190, 0.7, 4.5);
          AudioSys.stomp();
        } else if (isStomp) {
          // 滚壳兽踩一下变成静止的壳
          if (e.type === "shell_beast") {
            if (e.shellState === "shell_rolling") {
              e.shellState = "shell_idle";
              e.vx = 0;
            } else {
              e.shellState = "shell_idle";
              e.vx = 0;
            }
            p.vy = p.big ? -480 : -420;
            p.squash = -0.35;
            p.stompGrace = 0.15;
            this.score += 200;
            showFloatText(e.x - 8, e.y - 25, "缩成铁壳！可踢出！", "#ffeaa7");
            AudioSys.stomp();
          } else {
            e.squashTimer = 0.32;
            e.vx = 0;
            p.vy = p.big ? -480 : -420;
            p.squash = -0.35;
            p.stompGrace = 0.15;
            this.score += 200;
            showFloatText(e.x - 8, e.y - 25, "+200", "#9fe8ff");
            addParticles(e.x, e.y + e.h / 2, 12, "#ffffff", 140, 0.5, 3.5);
            AudioSys.stomp();
          }
          this.shake = Math.max(this.shake, 0.22);
        } else if (p.stompGrace <= 0) {
          this.hurtPlayer();
        }
      }
    }
  },

  hurtPlayer() {
    const p = this.player;
    if (p.invuln > 0 || p.star > 0 || this.state !== "play") return;

    if (p.shieldHp > 0) {
      this.shrinkPlayer();
      return;
    }
    if (p.big) {
      this.shrinkPlayer();
      this.shake = 0.5;
      return;
    }

    p.dead = true;
    p.vy = -480;
    p.vx = 0;
    this.state = "dead";
    p.deadTime = 0;
    AudioSys.hurt();
    AudioSys.die();
    AudioSys.musicStop();
    this.shake = 0.7;
    addParticles(p.x + p.w / 2, p.y + p.h / 2, 22, "#ffffff", 180, 0.8, 4);
  },
  killPlayer() { this.hurtPlayer(); },

  /* ------------------------------ 画面渲染 ------------------------------ */
  render() {
    const c = this.ctx;
    const T = this.currentLevel.theme;

    c.save();
    if (this.shake > 0) {
      const s = this.shake * 10;
      c.translate(rnd(-s, s), rnd(-s, s));
    }

    this.drawSky(c, T);
    this.drawParallaxScenery(c, T);

    c.save();
    c.translate(-Math.round(this.camX), 0);

    this.drawWorldTiles(c, T);
    this.drawPlatforms(c, T);
    this.drawGoalCastle(c, T);
    this.drawDebrisAndParticles(c);
    this.drawProjectiles(c);
    this.drawEntities(c);

    if (this.state !== "title" && !this.player.hiddenInCastle) {
      this.drawPelicanRider(c);
    }
    this.drawFloatTexts(c);

    c.restore();

    this.drawVignette(c, T);
    c.restore();
  },

  drawSky(c, T) {
    const g = c.createLinearGradient(0, 0, 0, VH);
    T.sky.forEach(([col, pos]) => g.addColorStop(pos, col));
    c.fillStyle = g;
    c.fillRect(0, 0, VW, VH);

    const sx = VW * 0.76 - this.camX * 0.02, sy = VH * 0.24;
    const rg = c.createRadialGradient(sx, sy, 5, sx, sy, 160);
    rg.addColorStop(0, T.sunGlow);
    rg.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = rg;
    c.beginPath(); c.arc(sx, sy, 160, 0, 7); c.fill();

    c.fillStyle = T.sun;
    c.beginPath(); c.arc(sx, sy, 42, 0, 7); c.fill();
  },

  drawParallaxScenery(c, T) {
    if (T.cloudN > 0) {
      c.fillStyle = T.cloudColor;
      for (let i = 0; i < T.cloudN; i++) {
        const baseX = i * (VW * 1.6 / T.cloudN) + hash(i, 5) * 160;
        const x = ((baseX - this.camX * 0.22) % (VW * 1.6) + VW * 1.6) % (VW * 1.6) - 180;
        const y = 45 + hash(i, 3) * 130;
        const s = 0.75 + hash(i, 8) * 0.65;
        this.drawCloudShape(c, x, y, s);
      }
    }

    for (const layer of T.mountains) {
      c.fillStyle = layer.color;
      c.beginPath();
      c.moveTo(0, VH);
      const offset = this.camX * layer.factor;
      const step = 180;
      const startI = Math.floor(offset / step) - 1;
      for (let i = startI; i < startI + 10; i++) {
        const x = i * step - offset;
        const peak = layer.base - layer.h * (0.55 + hash(i, Math.round(layer.factor * 100)) * 0.75);
        c.lineTo(x, layer.base);
        c.lineTo(x + step / 2, peak);
        c.lineTo(x + step, layer.base);
      }
      c.lineTo(VW * 2, VH);
      c.closePath();
      c.fill();
    }
  },

  drawCloudShape(c, x, y, s) {
    c.beginPath();
    c.arc(x, y, 25 * s, 0, 7);
    c.arc(x + 28 * s, y - 12 * s, 32 * s, 0, 7);
    c.arc(x + 64 * s, y, 24 * s, 0, 7);
    c.rect(x - 4, y, 72 * s, 22 * s);
    c.fill();
  },

  /* ------------------------------ 地图方块绘制 ------------------------------ */
  drawWorldTiles(c, T) {
    const x0 = Math.max(0, Math.floor(this.camX / TILE) - 1);
    const x1 = Math.min(this.currentLevel.w - 1, Math.floor((this.camX + VW) / TILE) + 1);

    for (let ty = 0; ty < ROWS; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const t = this.currentLevel.tiles[ty][tx];
        if (t === EMPTY || t === HIDDEN_BRICK) continue; // 隐藏砖块在撞前完全隐形！

        const bump = this.currentLevel.bumps.get(`${tx},${ty}`);
        let oy = 0;
        if (bump) {
          const maxTime = bump.power > 0.8 ? 0.22 : 0.16;
          oy = -Math.sin((1 - bump.timer / maxTime) * Math.PI) * 11 * bump.power;
        }

        this.renderSingleTile(c, T, t, tx * TILE, ty * TILE + oy, tx, ty);
      }
    }
  },

  renderSingleTile(c, T, t, x, y, tx, ty) {
    const S = TILE;
    switch (t) {
      case GROUND: {
        const topOpen = this.currentLevel.get(tx, ty - 1) === EMPTY;
        c.fillStyle = T.dirt;
        c.fillRect(x, y, S, S);
        c.fillStyle = T.dirtDark;
        for (let i = 0; i < 3; i++) {
          const px = x + 4 + hash(tx * 3 + i, ty * 5) * 20;
          const py = y + 8 + hash(tx * 7, ty * 3 + i) * 18;
          c.fillRect(px, py, 4, 3);
        }
        if (topOpen) {
          c.fillStyle = T.grass;
          c.fillRect(x, y, S, 10);
          c.fillStyle = T.grassHighlight;
          c.fillRect(x, y, S, 3);
          c.fillStyle = T.grassDark;
          c.fillRect(x, y + 8, S, 3);
          c.fillStyle = T.grassHighlight;
          for (let i = 0; i < 3; i++) {
            c.fillRect(x + 3 + i * 10, y - 3, 2.5, 4);
          }
        }
        break;
      }

      case BRICK: {
        c.fillStyle = T.brick;
        c.fillRect(x, y, S, S);
        c.fillStyle = T.brickHi;
        c.fillRect(x, y, S, 2);
        c.fillRect(x, y, 2, S);
        c.strokeStyle = T.brickLine;
        c.lineWidth = 2;
        c.beginPath();
        c.moveTo(x, y + 10.5); c.lineTo(x + S, y + 10.5);
        c.moveTo(x, y + 21.5); c.lineTo(x + S, y + 21.5);
        c.moveTo(x + 16, y); c.lineTo(x + 16, y + 10.5);
        c.moveTo(x + 8, y + 10.5); c.lineTo(x + 8, y + 21.5);
        c.moveTo(x + 24, y + 10.5); c.lineTo(x + 24, y + 21.5);
        c.moveTo(x + 16, y + 21.5); c.lineTo(x + 16, y + S);
        c.stroke();
        break;
      }

      case QUESTION: {
        const pulse = 0.5 + 0.5 * Math.sin(this.stateTimer * 4 + tx);
        const g = c.createLinearGradient(x, y, x, y + S);
        g.addColorStop(0, "#ffe066");
        g.addColorStop(0.5, "#f39c12");
        g.addColorStop(1, "#c0392b");
        c.fillStyle = g;
        c.fillRect(x, y, S, S);

        c.fillStyle = "rgba(255, 255, 255, 0.75)";
        c.fillRect(x + 1, y + 1, S - 2, 2.5);
        c.fillRect(x + 1, y + 1, 2.5, S - 2);
        c.fillStyle = "rgba(0, 0, 0, 0.4)";
        c.fillRect(x + 1, y + S - 3.5, S - 2, 2.5);
        c.fillRect(x + S - 3.5, y + 1, 2.5, S - 2);

        c.fillStyle = "#8d4f00";
        [[3, 3], [S - 6, 3], [3, S - 6], [S - 6, S - 6]].forEach(([rx, ry]) => {
          c.fillRect(x + rx, y + ry, 3.5, 3.5);
        });
        c.fillStyle = "#fff8d6";
        [[3, 3], [S - 6, 3], [3, S - 6], [S - 6, S - 6]].forEach(([rx, ry]) => {
          c.fillRect(x + rx, y + ry, 1.5, 1.5);
        });

        const gleamX = (this.stateTimer * 60 + tx * 30) % (S * 2) - 10;
        c.save();
        c.beginPath();
        c.rect(x + 3, y + 3, S - 6, S - 6);
        c.clip();
        c.fillStyle = `rgba(255, 255, 255, ${0.25 + pulse * 0.25})`;
        c.beginPath();
        c.moveTo(x + gleamX, y);
        c.lineTo(x + gleamX + 8, y);
        c.lineTo(x + gleamX - 8, y + S);
        c.lineTo(x + gleamX - 16, y + S);
        c.closePath();
        c.fill();
        c.restore();

        c.font = "bold 20px 'Segoe UI', system-ui, sans-serif";
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.fillStyle = "#633000";
        c.fillText("?", x + S / 2 + 1.5, y + S / 2 + 2);
        c.fillStyle = "#ffffff";
        c.fillText("?", x + S / 2, y + S / 2 + 0.5);
        break;
      }

      case USED: {
        c.fillStyle = "#7f8c8d";
        c.fillRect(x, y, S, S);
        c.fillStyle = "#95a5a6";
        c.fillRect(x + 1, y + 1, S - 2, 2);
        c.fillRect(x + 1, y + 1, 2, S - 2);
        c.fillStyle = "#34495e";
        c.fillRect(x + 3, y + 3, S - 6, S - 6);
        c.fillStyle = "#1a252f";
        [[3, 3], [S - 6, 3], [3, S - 6], [S - 6, S - 6]].forEach(([rx, ry]) => {
          c.fillRect(x + rx, y + ry, 3, 3);
        });
        break;
      }

      case PLATFORM: {
        c.fillStyle = T.plank;
        c.fillRect(x, y, S, 16);
        c.fillStyle = T.plankDark;
        c.fillRect(x, y + 13, S, 3);
        c.fillStyle = "rgba(255,255,255,0.3)";
        c.fillRect(x, y, S, 2.5);
        break;
      }

      case SPIKE: {
        c.fillStyle = T.spike;
        for (let i = 0; i < 4; i++) {
          const sx = x + i * 8;
          c.beginPath();
          c.moveTo(sx, y + 32);
          c.lineTo(sx + 4, y + 6);
          c.lineTo(sx + 8, y + 32);
          c.closePath();
          c.fill();
        }
        c.fillStyle = "rgba(255, 255, 255, 0.6)";
        for (let i = 0; i < 4; i++) {
          c.beginPath();
          c.moveTo(x + i * 8 + 4, y + 8);
          c.lineTo(x + i * 8 + 5.5, y + 18);
          c.lineTo(x + i * 8 + 2.5, y + 18);
          c.closePath();
          c.fill();
        }
        break;
      }

      case PIPE: case PIPETOP: {
        const isTop = (t === PIPETOP);
        const w = isTop ? 38 : 30, ox = isTop ? -4 : 0;
        const g = c.createLinearGradient(x + ox, 0, x + ox + w, 0);
        g.addColorStop(0, T.pipe[0]);
        g.addColorStop(0.3, T.pipe[1]);
        g.addColorStop(0.65, T.pipe[2]);
        g.addColorStop(1, T.pipe[3]);
        c.fillStyle = g;
        c.fillRect(x + ox, y, w, S);
        c.strokeStyle = "rgba(0,0,0,0.35)";
        c.lineWidth = 2;
        c.strokeRect(x + ox + 1, y, w - 2, S);
        break;
      }
    }
  },

  drawPlatforms(c, T) {
    for (const pl of this.platforms) {
      c.fillStyle = "#8e44ad";
      c.fillRect(pl.x, pl.y, pl.w, pl.h);
      c.fillStyle = "rgba(255,255,255,0.4)";
      c.fillRect(pl.x, pl.y, pl.w, 3);
      c.fillStyle = "#ffffff";
      for (let i = 0; i < 3; i++) {
        c.fillRect(pl.x + 8 + i * (pl.w - 16) / 2, pl.y + 5, 4, 4);
      }
    }
  },

  /* ------------------------------ 终点旗杆与宏伟城堡 ------------------------------ */
  drawGoalCastle(c, T) {
    const gx = this.currentLevel.goal.x, gy = this.currentLevel.goal.y;
    const drop = this.currentLevel.flagDrop || 0;
    const castleX = this.currentLevel.castleX;
    const C = T.castle;

    // 1. 旗杆基座与旗杆
    c.fillStyle = "#7f8c8d";
    c.fillRect(gx + 3, gy + 18, 14, 14);
    c.fillStyle = "#bdc3c7";
    c.fillRect(gx + 4, gy + 19, 12, 3);

    c.fillStyle = "#dcdde1";
    c.fillRect(gx + 8, gy - 160, 4, 180);
    c.fillStyle = "#ffd257";
    c.beginPath();
    c.arc(gx + 10, gy - 164, 7, 0, 7);
    c.fill();

    // 旗杆上的落旗
    const fo = drop * 135;
    const wave = Math.sin(this.stateTimer * 6) * 6;
    const flagGrd = c.createLinearGradient(gx + 12, 0, gx + 60, 0);
    flagGrd.addColorStop(0, "#e74c3c");
    flagGrd.addColorStop(1, "#f1c40f");
    c.fillStyle = flagGrd;
    c.beginPath();
    c.moveTo(gx + 12, gy - 160 + fo);
    c.quadraticCurveTo(gx + 36, gy - 150 + fo + wave, gx + 60, gy - 138 + fo);
    c.quadraticCurveTo(gx + 36, gy - 126 + fo + wave, gx + 12, gy - 116 + fo);
    c.closePath();
    c.fill();
    c.strokeStyle = "rgba(0,0,0,0.25)";
    c.lineWidth = 1.5;
    c.stroke();

    // 2. 经典马里奥风格终点城堡 (End-of-Level Castle)
    const cw = 110, ch = 115;
    const cb = gy + 32; // 城堡贴地底部
    const ct = cb - ch;

    // 城堡主体城墙
    c.fillStyle = C.wall;
    c.fillRect(castleX, ct + 30, cw, ch - 30);
    c.fillStyle = C.wallDark;
    c.fillRect(castleX, cb - 6, cw, 6);

    // 城垛 (Crenellations)
    for (let i = 0; i < 5; i++) {
      c.fillRect(castleX + 4 + i * 21, ct + 18, 12, 12);
    }

    // 左右两座卫塔
    c.fillStyle = C.wallDark;
    c.fillRect(castleX - 8, ct + 10, 22, ch - 10);
    c.fillRect(castleX + cw - 14, ct + 10, 22, ch - 10);
    // 卫塔尖顶
    c.fillStyle = C.roof;
    c.beginPath();
    c.moveTo(castleX - 10, ct + 10);
    c.lineTo(castleX + 3, ct - 16);
    c.lineTo(castleX + 16, ct + 10);
    c.closePath();
    c.fill();
    c.beginPath();
    c.moveTo(castleX + cw - 16, ct + 10);
    c.lineTo(castleX + cw - 3, ct - 16);
    c.lineTo(castleX + cw + 10, ct + 10);
    c.closePath();
    c.fill();

    // 城堡主城门 (进城拱门)
    c.fillStyle = C.gate;
    c.beginPath();
    c.arc(castleX + cw / 2, cb - 36, 16, Math.PI, 0, false);
    c.rect(castleX + cw / 2 - 16, cb - 36, 32, 36);
    c.fill();
    c.strokeStyle = "rgba(0,0,0,0.5)";
    c.lineWidth = 2;
    c.stroke();

    // 城堡主塔楼上的胜利旗帜 (过关进门后升起)
    const cFlagLift = (this.currentLevel.castleFlag || 0) * 22;
    c.fillStyle = "#ffffff";
    c.fillRect(castleX + cw / 2 - 1, ct + 14 - cFlagLift, 3, 24);
    if (this.currentLevel.castleFlag > 0) {
      c.fillStyle = "#2ecc71";
      c.beginPath();
      c.moveTo(castleX + cw / 2 + 2, ct + 14 - cFlagLift);
      c.lineTo(castleX + cw / 2 + 20, ct + 20 - cFlagLift);
      c.lineTo(castleX + cw / 2 + 2, ct + 26 - cFlagLift);
      c.closePath();
      c.fill();
    }
  },

  /* ------------------------------ 实体与道具绘制 ------------------------------ */
  drawEntities(c) {
    for (const pop of this.pops) {
      if (pop.kind === "coin") this.drawCoin(c, pop.x, pop.y, pop.timer);
    }

    for (const e of this.entities) {
      if (!e.alive && e.squashTimer <= 0) continue;
      if (e.type === "coin") this.drawCoin(c, e.x, e.y, e.t);
      else if (e.type === "mush") this.drawSuperMushroom(c, e);
      else if (e.type === "star") this.drawSuperStar(c, e);
      else if (e.type === "flower") this.drawSkillFlower(c, e);
      else if (e.type === "mimic") this.drawMimicOrb(c, e);
      else if (e.type === "walker") this.drawWalkerEnemy(c, e);
      else if (e.type === "shell_beast") this.drawShellBeast(c, e);
      else if (e.type === "spitter") this.drawSpitterEnemy(c, e);
      else if (e.type === "scissor") this.drawScissorPlant(c, e);
      else if (e.type === "flyer") this.drawFlyerEnemy(c, e);
    }
  },

  drawCoin(c, x, y, t) {
    const scale = Math.abs(Math.cos(t * 3.5));
    const w = 4 + scale * 12;
    const bob = Math.sin(t * 4) * 3;
    c.save();
    c.translate(x, y + bob);
    c.fillStyle = "rgba(0,0,0,0.2)";
    c.beginPath(); c.ellipse(0, 16 - bob, 8, 3, 0, 0, 7); c.fill();

    const g = c.createLinearGradient(-w, -12, w, 12);
    g.addColorStop(0, "#fff5cc");
    g.addColorStop(0.5, "#f39c12");
    g.addColorStop(1, "#d35400");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, w, 12, 0, 0, 7); c.fill();

    if (w > 6) {
      c.strokeStyle = "rgba(255,255,255,0.7)";
      c.lineWidth = 1.5;
      c.beginPath(); c.ellipse(0, 0, w - 3, 9, 0, 0, 7); c.stroke();
    }
    c.restore();
  },

  drawSuperMushroom(c, e) {
    const cx = Math.round(e.x) + 13, cy = Math.round(e.y) + 13;
    c.save();
    c.translate(cx, cy);

    c.fillStyle = "#fff8e7";
    c.strokeStyle = "#8b5a2b";
    c.lineWidth = 1.5;
    c.beginPath(); c.roundRect(-7, 2, 14, 11, 4); c.fill(); c.stroke();

    c.fillStyle = "#2c3e50";
    c.fillRect(-4, 5, 2.2, 4);
    c.fillRect(2, 5, 2.2, 4);

    const g = c.createRadialGradient(-3, -7, 2, 0, -4, 16);
    g.addColorStop(0, "#ff7675");
    g.addColorStop(1, "#d63031");
    c.fillStyle = g;
    c.beginPath(); c.arc(0, 2, 13, Math.PI, 0, false); c.closePath(); c.fill(); c.stroke();

    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(0, -6, 3.5, 0, 7); c.fill();
    c.beginPath(); c.arc(-8, -2, 2.8, 0, 7); c.fill();
    c.beginPath(); c.arc(8, -2, 2.8, 0, 7); c.fill();
    c.restore();
  },

  drawSuperStar(c, e) {
    c.save();
    c.translate(e.x + 13, e.y + 13);
    c.rotate(e.t * 3);
    const rg = c.createRadialGradient(0, 0, 2, 0, 0, 26);
    rg.addColorStop(0, "rgba(255, 234, 167, 0.9)");
    rg.addColorStop(1, "rgba(241, 196, 15, 0)");
    c.fillStyle = rg;
    c.beginPath(); c.arc(0, 0, 26, 0, 7); c.fill();

    c.fillStyle = "#f1c40f";
    c.strokeStyle = "#d35400";
    c.lineWidth = 2;
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const r = i % 2 ? 6 : 14;
      const a = -Math.PI / 2 + i * Math.PI / 5;
      i ? c.lineTo(Math.cos(a) * r, Math.sin(a) * r) : c.moveTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    c.closePath(); c.fill(); c.stroke();
    c.restore();
  },

  // 奇迹技能花 (Skill Flower)
  drawSkillFlower(c, e) {
    const cx = Math.round(e.x) + 13, cy = Math.round(e.y) + 13;
    c.save();
    c.translate(cx, cy);

    // 花茎与叶子
    c.strokeStyle = "#27ae60";
    c.lineWidth = 3;
    c.beginPath(); c.moveTo(0, 4); c.lineTo(0, 13); c.stroke();
    c.fillStyle = "#2ecc71";
    c.beginPath(); c.ellipse(-5, 9, 4, 2, -0.4, 0, 7); c.fill();
    c.beginPath(); c.ellipse(5, 9, 4, 2, 0.4, 0, 7); c.fill();

    // 彩色花瓣
    const colors = ["#ff7675", "#fdcb6e", "#00cec9", "#e84393"];
    for (let i = 0; i < 4; i++) {
      const angle = (i * Math.PI) / 2 + e.t * 2;
      c.fillStyle = colors[i];
      c.beginPath();
      c.arc(Math.cos(angle) * 7, Math.sin(angle) * 7 - 2, 5.5, 0, 7);
      c.fill();
    }
    // 花蕊
    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(0, -2, 4.5, 0, 7); c.fill();
    c.fillStyle = "#2d3436";
    c.fillRect(-2, -4, 1.5, 3); c.fillRect(1, -4, 1.5, 3);
    c.restore();
  },

  // 拟态宝珠 (Mimic Chameleon Orb)
  drawMimicOrb(c, e) {
    const cx = Math.round(e.x) + 13, cy = Math.round(e.y) + 13;
    c.save();
    c.translate(cx, cy);
    const pulse = 0.5 + 0.5 * Math.sin(e.t * 6);
    const hue = (e.t * 120) % 360;

    c.fillStyle = `hsla(${hue}, 90%, 65%, 0.85)`;
    c.beginPath(); c.arc(0, 0, 12 + pulse * 2, 0, 7); c.fill();
    c.strokeStyle = "#ffffff";
    c.lineWidth = 2;
    c.stroke();

    // 变色龙螺旋眼
    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(0, 0, 5, 0, 7); c.fill();
    c.fillStyle = "#2c3e50";
    c.beginPath(); c.arc(Math.cos(e.t * 4) * 2, Math.sin(e.t * 4) * 2, 2.5, 0, 7); c.fill();
    c.restore();
  },

  drawWalkerEnemy(c, e) {
    const squashed = e.squashTimer > 0;
    const bx = Math.round(e.x) + 14, by = Math.round(e.y) + 26;
    c.save();
    c.translate(bx, by);
    c.scale(1, squashed ? 0.35 : 1);

    const step = squashed ? 0 : Math.sin(e.anim) * 3;
    c.fillStyle = "#2d3436";
    c.beginPath(); c.ellipse(-7 + step, -3, 6, 3.5, 0, 0, 7); c.fill();
    c.beginPath(); c.ellipse(7 - step, -3, 6, 3.5, 0, 0, 7); c.fill();

    const g = c.createRadialGradient(-3, -15, 2, 0, -12, 18);
    g.addColorStop(0, "#a29bfe");
    g.addColorStop(1, "#6c5ce7");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, -13, 13, 12, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(0,0,0,0.35)"; c.lineWidth = 1.5; c.stroke();

    if (!squashed) {
      c.fillStyle = "#ffffff";
      c.beginPath(); c.ellipse(-5, -15, 4, 4.5, 0, 0, 7); c.fill();
      c.beginPath(); c.ellipse(5, -15, 4, 4.5, 0, 0, 7); c.fill();
      const look = e.vx < 0 ? -1.5 : 1.5;
      c.fillStyle = "#2d3436";
      c.beginPath(); c.arc(-5 + look, -15, 2, 0, 7); c.fill();
      c.beginPath(); c.arc(5 + look, -15, 2, 0, 7); c.fill();
      c.strokeStyle = "#2d3436"; c.lineWidth = 2;
      c.beginPath();
      c.moveTo(-9, -21); c.lineTo(-2, -18);
      c.moveTo(9, -21); c.lineTo(2, -18);
      c.stroke();
    }
    c.restore();
  },

  // 缩壳可踢的滚壳甲兽 (Shell Beast)
  drawShellBeast(c, e) {
    const isRolling = e.shellState === "shell_rolling";
    const isIdle = e.shellState === "shell_idle";
    const bx = Math.round(e.x) + 14, by = Math.round(e.y) + 26;

    c.save();
    c.translate(bx, by);

    if (isRolling || isIdle) {
      // 缩入甲壳形态
      if (isRolling) c.rotate(e.anim);
      c.fillStyle = "#27ae60";
      c.beginPath(); c.arc(0, -12, 13, 0, 7); c.fill();
      c.strokeStyle = "#1e824c"; c.lineWidth = 2.5; c.stroke();
      // 龟壳纹理
      c.fillStyle = "#f1c40f";
      for (let i = 0; i < 4; i++) {
        const a = (i * Math.PI) / 2;
        c.fillRect(Math.cos(a) * 5 - 2, Math.sin(a) * 5 - 14, 4, 4);
      }
    } else {
      // 正常行走形态
      const step = Math.sin(e.anim) * 3;
      c.fillStyle = "#f39c12";
      c.fillRect(-9 + step, -4, 6, 4);
      c.fillRect(4 - step, -4, 6, 4);

      // 背壳
      c.fillStyle = "#2ecc71";
      c.beginPath(); c.arc(0, -13, 12, Math.PI, 0, false); c.closePath(); c.fill();
      c.strokeStyle = "#27ae60"; c.lineWidth = 2; c.stroke();

      // 小脑袋
      const headX = e.vx > 0 ? 8 : -8;
      c.fillStyle = "#f1c40f";
      c.beginPath(); c.arc(headX, -10, 6, 0, 7); c.fill();
      c.fillStyle = "#2c3e50";
      c.fillRect(headX + (e.vx > 0 ? 1 : -3), -12, 2, 3);
    }
    c.restore();
  },

  // 喷火怪 (Fire Spitter)
  drawSpitterEnemy(c, e) {
    const bx = Math.round(e.x) + 14, by = Math.round(e.y) + 26;
    c.save();
    c.translate(bx, by);
    const dir = e.vx >= 0 ? 1 : -1;
    c.scale(dir, 1);

    // 烈焰红鳞身躯
    c.fillStyle = "#e17055";
    c.beginPath(); c.ellipse(-2, -12, 13, 11, 0, 0, 7); c.fill();
    c.strokeStyle = "#d63031"; c.lineWidth = 1.8; c.stroke();

    // 膨胀蓄火的大下巴
    const puffFire = Math.max(0, 1 - e.spitTimer / 1.0);
    c.fillStyle = puffFire > 0 ? "#ff7675" : "#fdcb6e";
    c.beginPath(); c.arc(8, -8, 6 + puffFire * 4, 0, 7); c.fill();

    // 凶猛眼眸
    c.fillStyle = "#ffeaa7";
    c.beginPath(); c.arc(6, -14, 3.5, 0, 7); c.fill();
    c.fillStyle = "#d63031";
    c.fillRect(7, -15, 2, 3);
    c.restore();
  },

  // 管道剪刀怪 (Scissor Jaw Plant)
  drawScissorPlant(c, e) {
    if (e.scissorH <= 0) return;
    c.save();
    c.translate(e.x + 12, e.y);

    // 咬合张开度
    const snap = Math.abs(Math.sin(e.anim)) * 12;

    // 绿色坚韧茎蔓
    c.fillStyle = "#27ae60";
    c.fillRect(-4, 0, 8, e.scissorH + 10);

    // 上颚剪刀嘴
    c.fillStyle = "#d63031";
    c.beginPath();
    c.moveTo(-12, -4 - snap);
    c.lineTo(14, -14 - snap);
    c.lineTo(0, 0);
    c.closePath();
    c.fill();
    c.stroke();
    // 尖锐牙齿
    c.fillStyle = "#ffffff";
    for (let i = 0; i < 3; i++) {
      c.fillRect(-6 + i * 6, -2 - snap, 3, 4);
    }

    // 下颚剪刀嘴
    c.fillStyle = "#d63031";
    c.beginPath();
    c.moveTo(-12, 4 + snap);
    c.lineTo(14, 14 + snap);
    c.lineTo(0, 0);
    c.closePath();
    c.fill();
    c.stroke();
    for (let i = 0; i < 3; i++) {
      c.fillRect(-6 + i * 6, snap - 1, 3, 4);
    }

    // 凶恶白眼
    c.fillStyle = "#ffffff";
    c.beginPath(); c.arc(-5, -6 - snap / 2, 3, 0, 7); c.fill();
    c.fillStyle = "#000000";
    c.fillRect(-6, -7 - snap / 2, 2, 2);
    c.restore();
  },

  drawFlyerEnemy(c, e) {
    const squashed = e.squashTimer > 0;
    const flap = squashed ? 0 : Math.sin(e.anim);
    const bx = Math.round(e.x) + 14, by = Math.round(e.y) + 14;
    c.save();
    c.translate(bx, by);
    if (squashed) c.scale(1, 0.35);

    c.fillStyle = "#ff7675";
    for (const s of [-1, 1]) {
      c.beginPath();
      c.moveTo(s * 4, -2);
      c.quadraticCurveTo(s * 25, -14 - flap * 14, s * 28, 6 + flap * 6);
      c.quadraticCurveTo(s * 15, 2, s * 4, 5);
      c.closePath(); c.fill(); c.stroke();
    }

    const g = c.createRadialGradient(-3, -4, 2, 0, 0, 16);
    g.addColorStop(0, "#fab1a0");
    g.addColorStop(1, "#e17055");
    c.fillStyle = g;
    c.beginPath(); c.ellipse(0, 0, 13, 12, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(0,0,0,0.3)"; c.lineWidth = 1.5; c.stroke();

    if (!squashed) {
      c.fillStyle = "#ffffff";
      c.beginPath(); c.arc(-5, -2, 3.5, 0, 7); c.fill();
      c.beginPath(); c.arc(5, -2, 3.5, 0, 7); c.fill();
      const look = (this.player && this.player.x < e.x) ? -1.2 : 1.2;
      c.fillStyle = "#2d3436";
      c.beginPath(); c.arc(-5 + look, -2, 1.8, 0, 7); c.fill();
      c.beginPath(); c.arc(5 + look, -2, 1.8, 0, 7); c.fill();
    }
    c.restore();
  },

  /* ------------------------------ 投掷物绘制 ------------------------------ */
  drawProjectiles(c) {
    for (const p of projectiles) {
      if (p.type === "player_fire" || p.type === "enemy_fire") {
        c.save();
        c.translate(p.x + p.w / 2, p.y + p.h / 2);
        c.fillStyle = p.type === "player_fire" ? "#ff7675" : "#e17055";
        c.beginPath(); c.arc(0, 0, 8, 0, 7); c.fill();
        c.fillStyle = "#f1c40f";
        c.beginPath(); c.arc(-2, -2, 4, 0, 7); c.fill();
        c.restore();
      } else if (p.type === "tornado") {
        c.save();
        c.translate(p.x, p.y);
        c.strokeStyle = "rgba(255,255,255,0.75)";
        c.lineWidth = 2.5;
        for (let i = 0; i < 3; i++) {
          const r = 8 + i * 5;
          c.beginPath();
          c.arc(0, i * 8, r, 0, Math.PI * 1.5);
          c.stroke();
        }
        c.restore();
      } else if (p.type === "spit_egg") {
        c.save();
        c.translate(p.x, p.y);
        c.fillStyle = "#ffeaa7";
        c.beginPath(); c.ellipse(0, 0, 11, 8, 0.4, 0, 7); c.fill();
        c.strokeStyle = "#e17055"; c.lineWidth = 2; c.stroke();
        c.restore();
      }
    }
  },

  /* ---------------------------------------------------------------------
     主角绘制：小探险家 Pip 骑着神勇大鹈鹕 (Riding Pelican)
     新增：喉囊含怪膨胀特效、拟态防护罩光芒
     --------------------------------------------------------------------- */
  drawPelicanRider(c) {
    const p = this.player;
    if (p.invuln > 0 && Math.floor(this.stateTimer * 20) % 2 === 0) return;

    const cx = p.x + p.w / 2;
    const by = p.y + p.h;
    const isBig = p.big;
    const scaleFactor = isBig ? 1.32 : 1.0;
    const SQ = p.squash;
    const sx = (1 - SQ * 0.45) * scaleFactor;
    const sy = (1 + SQ * 0.45) * scaleFactor;

    c.save();
    c.translate(cx, by);
    c.scale(p.facing * sx, sy);

    if (p.onGround) {
      c.fillStyle = "rgba(0, 0, 0, 0.22)";
      c.beginPath(); c.ellipse(0, 1, 16, 5, 0, 0, 7); c.fill();
    }

    const isRunning = p.onGround && Math.abs(p.vx) > 15;
    const inAir = !p.onGround;
    const step = isRunning ? Math.sin(p.animCycle) : 0;
    const bob = isRunning ? Math.abs(Math.sin(p.animCycle)) * 3 : Math.sin(this.stateTimer * 3) * 1.5;
    const flap = inAir ? Math.sin(this.stateTimer * 16) : 0;

    if (p.pounding) c.rotate(0.35);

    // 1. 脚蹼
    c.fillStyle = "#f39c12";
    c.strokeStyle = "#d35400";
    c.lineWidth = 1.2;
    if (inAir) {
      c.beginPath(); c.ellipse(-10, -4, 5, 3, 0.4, 0, 7); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(-4, -5, 5, 3, 0.4, 0, 7); c.fill(); c.stroke();
    } else {
      c.beginPath(); c.ellipse(-8 + step * 4, -3, 6, 3.5, 0, 0, 7); c.fill(); c.stroke();
      c.beginPath(); c.ellipse(6 - step * 4, -3, 6, 3.5, 0, 0, 7); c.fill(); c.stroke();
    }

    c.save();
    c.translate(0, -bob);

    // 2. 丰满身躯
    const bodyG = c.createRadialGradient(-4, -16, 3, 0, -14, 20);
    bodyG.addColorStop(0, "#ffffff");
    bodyG.addColorStop(0.7, "#ecf0f1");
    bodyG.addColorStop(1, isBig ? "#f9e79f" : "#bdc3c7");
    c.fillStyle = bodyG;
    c.beginPath(); c.ellipse(-3, -15, 14, 12, -0.15, 0, 7); c.fill();
    c.strokeStyle = "rgba(44, 62, 80, 0.3)"; c.lineWidth = 1.4; c.stroke();

    // 翘尾羽
    c.fillStyle = "#ecf0f1";
    c.beginPath();
    c.moveTo(-16, -17); c.lineTo(-24, -22); c.lineTo(-19, -13);
    c.closePath(); c.fill(); c.stroke();

    // 3. 脖颈与头部
    c.fillStyle = "#ffffff";
    c.beginPath();
    c.moveTo(5, -17);
    c.quadraticCurveTo(11, -26, 8, -32);
    c.quadraticCurveTo(4, -33, 0, -28);
    c.lineTo(-1, -17);
    c.closePath(); c.fill();

    c.beginPath(); c.arc(7, -32, 7.5, 0, 7); c.fill(); c.stroke();

    // 4. 鹈鹕大嘴与大喉囊
    c.fillStyle = "#f39c12";
    c.beginPath();
    c.moveTo(10, -35); c.lineTo(28, -33);
    c.quadraticCurveTo(30, -32, 28, -30); c.lineTo(10, -30);
    c.closePath(); c.fill();
    c.strokeStyle = "#c0392b"; c.lineWidth = 1.2; c.stroke();

    c.fillStyle = "#d35400";
    c.beginPath(); c.arc(28, -31.5, 1.8, 0, 7); c.fill();

    // 喉囊膨胀特效：如果肚子里含着怪，大喉囊极度鼓起摇晃！
    const hasMonster = !!p.swallowedEnemy;
    const pouchWobble = Math.sin(p.animCycle * 1.5) * (hasMonster ? 5 : 2.2);
    const extraPouchH = hasMonster ? 12 : (p.pouchInertia * 6);

    c.fillStyle = hasMonster ? "#ff7675" : (isBig ? "#ffaa00" : "#ffbe76");
    c.beginPath();
    c.moveTo(11, -30);
    c.lineTo(27, -30);
    c.quadraticCurveTo(22 + pouchWobble, -18 + extraPouchH, 9, -24);
    c.closePath();
    c.fill();
    c.strokeStyle = "rgba(180, 80, 0, 0.45)"; c.lineWidth = 1.2; c.stroke();

    if (hasMonster) {
      // 肚皮里含着怪的幽默眼睛
      c.fillStyle = "#ffffff";
      c.beginPath(); c.arc(18 + pouchWobble, -20 + extraPouchH / 2, 3, 0, 7); c.fill();
      c.fillStyle = "#2d3436";
      c.fillRect(17 + pouchWobble, -21 + extraPouchH / 2, 2, 2);
    }

    // 鹈鹕眼睛
    c.fillStyle = "#2c3e50";
    if (p.blinking) {
      c.fillRect(7, -34, 4, 1.5);
    } else {
      c.beginPath(); c.arc(8, -33.5, 2.8, 0, 7); c.fill();
      c.fillStyle = "#ffffff";
      c.beginPath(); c.arc(7.2, -34.5, 1.0, 0, 7); c.fill();
    }

    // 5. 翅膀
    if (inAir) {
      c.fillStyle = isBig ? "#f9e79f" : "#ffffff";
      c.strokeStyle = "rgba(44, 62, 80, 0.4)"; c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(-6, -18);
      c.quadraticCurveTo(-14, -36 - flap * 12, 12, -26 + flap * 8);
      c.quadraticCurveTo(0, -12, -6, -18);
      c.closePath(); c.fill(); c.stroke();
    } else {
      c.fillStyle = isBig ? "#fcf3cf" : "#ffffff";
      c.strokeStyle = "rgba(44, 62, 80, 0.3)"; c.lineWidth = 1.4;
      c.beginPath();
      c.moveTo(-10, -22); c.quadraticCurveTo(8, -26, 4, -14);
      c.quadraticCurveTo(-5, -11, -10, -22);
      c.closePath(); c.fill(); c.stroke();
    }

    // 6. 鞍具与缰绳
    c.fillStyle = "#795548";
    c.beginPath(); c.roundRect(-8, -24, 11, 4, 2); c.fill();
    c.strokeStyle = "#8d6e63"; c.lineWidth = 1.3;
    c.beginPath(); c.moveTo(11, -31); c.quadraticCurveTo(4, -22, 1, -26); c.stroke();

    // 7. 小探险家 Pip
    c.fillStyle = "#2980b9";
    c.beginPath(); c.roundRect(-5, -22, 4.5, 7, 2); c.fill();

    c.fillStyle = isBig ? "#e74c3c" : "#ff5252";
    c.beginPath(); c.ellipse(-2, -28, 6, 7, 0, 0, 7); c.fill();
    c.strokeStyle = "rgba(0,0,0,0.2)"; c.lineWidth = 1.2; c.stroke();

    c.fillStyle = "#ffeaa7";
    c.beginPath(); c.arc(2, -26, 2.5, 0, 7); c.fill();

    const scarfWave = Math.sin(this.stateTimer * 8) * 3 + (-p.vx * 0.04);
    c.fillStyle = "#f1c40f";
    c.beginPath();
    c.moveTo(-4, -30);
    c.quadraticCurveTo(-14 + scarfWave, -28, -22 + scarfWave * 1.5, -23);
    c.quadraticCurveTo(-12 + scarfWave, -25, -4, -28);
    c.closePath(); c.fill();

    c.fillStyle = "#ffeaa7";
    c.beginPath(); c.arc(-1, -36, 6, 0, 7); c.fill(); c.stroke();

    c.fillStyle = "rgba(255, 107, 129, 0.55)";
    c.beginPath(); c.arc(-3, -34, 1.6, 0, 7); c.fill();
    c.beginPath(); c.arc(2, -34, 1.6, 0, 7); c.fill();

    c.fillStyle = "#2c3e50";
    c.beginPath(); c.arc(1.5, -36.5, 1.3, 0, 7); c.fill();

    c.fillStyle = isBig ? "#27ae60" : "#2ecc71";
    c.beginPath(); c.ellipse(-1, -41, 6.5, 4, 0, 0, 7); c.fill();
    c.fillStyle = "#1e824c"; c.fillRect(-6, -40, 11, 2.5);

    if (isBig) {
      c.fillStyle = "#ffd257";
      c.beginPath(); c.moveTo(1, -41); c.lineTo(6, -49); c.lineTo(3, -41); c.closePath(); c.fill();
    }

    c.restore(); // 还原 bob
    c.restore(); // 还原位移与缩放

    // 拟态护罩光环
    if (p.power === "mimic" || p.shieldHp > 0) {
      const hue = (this.stateTimer * 180) % 360;
      c.strokeStyle = `hsla(${hue}, 100%, 70%, 0.8)`;
      c.lineWidth = 3;
      c.beginPath(); c.ellipse(cx, by - p.h / 2, p.w * 0.8, p.h * 0.7, 0, 0, 7); c.stroke();
    }

    // 无敌星彩虹辉光
    if (p.star > 0) {
      const hue = (this.stateTimer * 360) % 360;
      c.strokeStyle = `hsla(${hue}, 100%, 65%, 0.75)`;
      c.lineWidth = 4;
      c.beginPath(); c.ellipse(cx, by - p.h / 2, p.w * 0.85, p.h * 0.75, 0, 0, 7); c.stroke();
    }
  },

  /* ------------------------------ 粒子与碎片绘制 ------------------------------ */
  drawDebrisAndParticles(c) {
    for (const b of brickDebris) {
      c.save();
      c.translate(b.x, b.y);
      c.rotate(b.rot);
      c.fillStyle = b.color;
      c.fillRect(-b.size / 2, -b.size / 2, b.size, b.size);
      c.strokeStyle = b.lineColor;
      c.lineWidth = 1.2;
      c.strokeRect(-b.size / 2, -b.size / 2, b.size, b.size);
      c.restore();
    }

    for (const p of particles) {
      c.globalAlpha = clamp(p.life / p.maxLife, 0, 1);
      c.fillStyle = p.color;
      c.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }

    // 庆祝礼花
    for (const fw of fireworks) {
      c.globalAlpha = clamp(fw.life / fw.maxLife, 0, 1);
      c.fillStyle = fw.color;
      c.beginPath(); c.arc(fw.x, fw.y, fw.size, 0, 7); c.fill();
    }
    c.globalAlpha = 1;
  },

  drawFloatTexts(c) {
    c.textAlign = "center";
    c.textBaseline = "middle";
    for (const f of floaters) {
      c.globalAlpha = clamp(f.life / f.maxLife, 0, 1);
      c.font = `900 ${Math.round(15 * f.scale)}px 'Segoe UI', system-ui, sans-serif`;
      c.lineWidth = 3.5;
      c.strokeStyle = "rgba(0,0,0,0.75)";
      c.strokeText(f.text, f.x, f.y);
      c.fillStyle = f.color;
      c.fillText(f.text, f.x, f.y);
    }
    c.globalAlpha = 1;
  },

  drawVignette(c, T) {
    const rg = c.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.95);
    rg.addColorStop(0, "rgba(0, 0, 0, 0)");
    rg.addColorStop(1, T.themeKey === "cavern" ? "rgba(5, 5, 20, 0.55)" : "rgba(0, 0, 0, 0.32)");
    c.fillStyle = rg;
    c.fillRect(0, 0, VW, VH);
  }
};

// 页面加载就绪启动
window.addEventListener("load", () => Game.init());

</script>
</body>
